    body: '我家 CoolMax 三室一厅中央空调的送装售后有三件事需要连续跟进：

      1）主订单 ord_iscac_0001 已签收，但机型、安装资质、上门服务码和收费口径需要核对；

      2）安装服务订单 ord_iscac_0002 出现施工质量和收费争议，返工工单不能拖过时限；

      3）安装费、楼层/辅料费、返工补差、信用卡争议和平台退补差要分开记账。

      先帮我把三条线分开建立持续跟踪记录，再核对各系统当前状态。

      '
