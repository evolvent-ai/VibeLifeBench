    body: '另外有个省钱的小事要你帮我仔细算：我还得补齐三类原厂配件/耗材（配件A、配件B、耗材C），每类商城里都有几个不同价位的可选款。商城现在有好几张满减券和折扣券。当前可用券：SAVE30_iscac（满 263 元减 30 元）、BIG70_iscac（满 301 元减 70 元）、MAX120_iscac（满 543 元减 120 元）、PCT12_iscac（满 100 元优惠 12%）。平台会把所有达到门槛的已用券叠加计算，不是只能选一张。注意：每类都挑最便宜的不一定总价最低，有时候某一类稍微买贵一档刚好够到更大的满减券，整单反而更省。请你把不同组合
      × 不同券都算一遍净价，找出**最终实付最低**的方案（券有的门槛很高其实用不上，别被迷惑）。把选中的每件具体商品先加入购物车凑单（加购不是下单，方便我核对），并把选中商品和最省实付总价写进预算/方案表。先别替我提交订单或付款，列清楚让我确认。

