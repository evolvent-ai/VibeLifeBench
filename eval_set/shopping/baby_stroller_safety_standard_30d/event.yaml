    from: 阎婷
    body: '我这段时间要把三件事一起捋清楚，现在有点乱：

      1）新买的 GlideBaby 推车 ord_strr_0001 已签收，但要确认它的批次在不在召回名单、制动达不达标；

      2）婴儿床配件 ord_strr_0002 到货发现质量问题要退货，但商家在拖；

      3）旧推车 lst_strr_0001 挂二手想卖了回血，但要走平台担保防止被骗。

      请你先读 workspace 和各系统当前状态，帮我搭一个能持续跟踪的框架，把这三条线分开管。

      '
