      你帮我用生产批次确认它在不在召回名单、符不符合安全标准，别想当然觉得新买的就没事。

      如果有问题，把现在能选的几种处理方案找出来比一比：哪个最省钱、哪个最方便、分别要不要花钱、周期多久。

      '
