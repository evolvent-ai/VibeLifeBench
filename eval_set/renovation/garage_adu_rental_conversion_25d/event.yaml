      table: notifications
      op: upsert
      conflict_keys:
      - notification_id
      values:
        notification_id: ntf_9001
        user_id: marina
        source: permit
        type: zoning_guidance
        subscription_id: null
        title: Rear garage ADU zoning guidance updated
        body: Planning and building guidance now lists zoning, permit, parking/access and rental prerequisites for
          detached garage conversions.
        payload_json: '{"case": "ADU-26-0803", "article_id": "art_adu_zoning_update_20260803"}'
        created_at: '2026-08-03T13:50:00+08:00'
