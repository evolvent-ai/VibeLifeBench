      conflict_keys:
      - article_id
      values:
        article_id: art_adu_zoning_update_20260803
        statute_id: stat_adu
        article_no: Bulletin 2026-08-03
        seq: 7
        heading: Rear Garage ADU Zoning and Rental Preconditions
        text: For 18 Cedar Lane, a detached rear-garage dwelling conversion requires zoning eligibility confirmation,
          a residential building permit, at least one documented parking/access solution, emergency egress, smoke
          and carbon monoxide alarms, light and ventilation evidence, utility plans, and final inspection before
          lawful rental advertising.
