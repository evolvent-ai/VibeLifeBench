    time: '10:00'
    kind: user_message
    from: zhou_mu
    body: |
      静安"装饰装修一件事" 我看到推送了. 我们项目在浦东但平台是市级,
      所以也适用. 请你今天就启动一件事 申请 (commercial_fit_up_filing_001),
      申请窗口在开工前 (7-06 拆除开工). 缺什么文档先列, 别等到周末.
  2:
  - id: D2_vendor_shortlist_prompt
    time: 09:00
    kind: user_message
    from: zhou_mu
    body: |
      candidate 商业 design_build 至少给我 3 家比较. 我不要家装队, 要:
      (1) 建装一级 OR 二级 资质 + 装饰甲乙级 设计专项;
      (2) 写字楼/陆家嘴/前滩 经验 (候选: 沪安 prov_v3_001_commercial_design_build,
          申品 prov_v3_002_commercial_design_build (陆家嘴样板间最近),
          博远 prov_v3_007_commercial_design_build (静安一件事代办),
          沪睿 prov_v3_008_commercial_design_build, 领创
          prov_v3_003_commercial_design_build);
      (3) 价格档 mid 或 premium; budget 档不要 (近期消防返工投诉的
          prov_v3_006_commercial_design_build, prov_v3_009_commercial_design_build
          剔除);
      (4) lead_time + 可用窗口 必须 cover 60 天 fit-up + 入驻 09-01.
      落到 vendor_comparison.md, 引用 review_count / known_risks /
      complaint_tags 原文.
  - id: D2_insurance_quote_email
    time: '10:30'
    kind: world
    source: emails
    body: |
      [Inbound — 工程一切险 经纪]
      From: broker@safehands-insurance.example.com (慧择保险经纪 商业部)
      Subject: 【慧择保险经纪】陆家嘴 300㎡ fit-out 工程一切险 询价单

      周牧先生您好,

      根据您提供的项目信息 (¥80 万工程款 + 30 人办公室 + 商业 fit-up),
      我们整理了三档报价:

      - ins_v3_001 Ping-Equiv 标准款: 0.5% × ¥80 万 = ¥4,000 / 年期;
        含工程本身损失 + 第三方; 适用 ≤¥200 万 项目.
      - ins_v3_011 Ping-Equiv 商业 fit-out 专项: 1.0% × ¥80 万 = ¥8,000;
        含静安 一件事 项目 + 消防整改保障; 推荐.
      - ins_v3_012 GuardOne 第三方责任险 商业 1000 万: 0.5% × ¥80 万 =
        ¥4,000; 责任限额 ¥1,000 万 (含写字楼内人员意外); 建议叠加.

      工程一切险 必须在 fit-up 期开始 (7-06) 前 在保, 否则 物业 不放行.
      请回复确认档位.

      慧择保险经纪 / 商业部 王经理 / 138-0000-9001
  - id: D2_insurance_owner_question
    time: '11:30'
    kind: user_message
    from: zhou_mu
    body: |
      我应该买哪种工程一切险? 标准款 (¥4k) 还是商业版 (¥8k)?
      300 ㎡ 80 万 项目 + 静安"一件事" + 消防风险.
      你给我建议, 不要"看情况", 要落地选哪个.
