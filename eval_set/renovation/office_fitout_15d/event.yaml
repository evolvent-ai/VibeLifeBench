    time: 09:30
    kind: world
    source: notion
    body: |
      静安 装饰装修一件事 改革 索引已加载:
      rule_property_v3_005 (≥¥100 万 OR ≥300 ㎡ 非居住装修 必走一件事 平台,
      合并 housing/fire/safety/pass-issuance 单窗口),
      rule_property_v3_013 (强弱电 ≥4kW/100㎡ + 应急照明 + 甲醛 ≤0.05),
      rule_property_v2_011 (浦东亦适用; 静安 区为示范区).
      项目 300 ㎡ + 80 万 命中两个阈值, 必走一件事 申请.
