# Event timeline. Top-level stages are keyed by stage index.

stages:
  0:
  - id: D0_kickoff_brief
    time: 09:00
    kind: user_message
    from: zhou_mu
    body: |
      我是周牧, 公司 COO, 代表公司决策. 我们租了浦东陆家嘴金融中心 4 楼
      300 ㎡, 要 fit-out 成 30 人办公室 (1 大会议室 + 1 小会议室 + 接待区
      + 休息区). 租约 fit-up 期 2026-07-01..08-31, 入驻 D-day = 09-01 hard.
      预算 80 万 + 5% 不确定预留. 你来跟整个 commercial fit-out PM 工作.

      关键约束: 消防一次过 (失败延 7-14 天 入驻); 强弱电 ≥4kW/100㎡ 必达;
      静安"装饰装修一件事" 平台 (300㎡ 非居住正好触发); 工程一切险 必买;
      楼内 19:00 前不能扰民; 周末施工 物业管制. 不是家装队 — 必须找
      商业 design_build 资质 (建装一级/二级 + 装饰甲乙级).

      先给我 today 的初版 plan: 现在决定什么 / 未来 5 天关键节点 /
      你需要我授权什么. bullet 风格, 时间戳, 不啰嗦.
