schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "travel/hard-business-trip-tokyo-24-day"
description = "A 35-step, 24-stage Harbor task for planning and reconciling an international business trip disrupted by a typhoon, with refundable booking constraints, multi-currency accounting, calendar conflicts, insurance compliance, and expense documentation."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "business-travel", "Tokyo", "flight-disruption", "multi-currency", "expense-reconciliation", "insurance"]

[metadata]
difficulty = "hard"
category = "business-travel"
tags = ["long-horizon", "event-driven", "typhoon", "refundable-booking", "calendar-conflict", "transit", "receipt-gap", "notion-archive"]
source_task = "hard_biz_trip_24d_v4_hybrid_gate_diff_20260627"
source_event_count = 42
virtual_stage_count = 24
harbor_step_count = 35
release_count = 7
stage_boundary_count = 24
server_count = 9
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "business travel and corporate operations"
occupation = "business travel coordinator"
onet_skills = ["planning", "risk assessment", "financial reconciliation", "information ordering", "decision making"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 36.0

[metadata.resources]
input_file_count = 0
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 7
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email-drafts", "booking-records"]
deliverables = ["trip journal", "flight and hotel comparison", "multi-currency budget", "pre-departure checklist", "expense report", "reimbursement email draft", "final trip archive"]

