schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "local/lin-ming-sf-summit"
description = "A 23-step Harbor task for arranging a San Francisco industry summit trip across flights, hotel, visa status, calendar, budget, and reimbursement."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "business-travel", "flights", "hotel", "visa", "calendar", "budget", "reimbursement", "mutation"]

[metadata]
difficulty = "hard"
category = "business_travel"
tags = ["long-horizon", "multi-step", "travel", "budget", "visa", "calendar", "reimbursement"]
source_task = "lin_ming_sf_summit"
virtual_stage_count = 26
harbor_step_count = 23
source_event_count = 28
release_count = 5
stage_boundary_count = 21
server_count = 8
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "business travel operations"
occupation = "executive travel assistant"
onet_skills = ["monitoring", "planning", "judgment and decision making", "time management", "information ordering"]

[metadata.estimates]
task_completion_hours = 10.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 5
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email", "flight-booking", "hotel-booking", "visa-records", "reimbursement-records"]
deliverables = ["trip plan", "budget tracker", "decision log", "calendar schedule", "flight and hotel bookings", "visa and passport record", "reimbursement pre-clearance", "final travel summary"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[steps]]
name = "event-000"
min_reward = { verifier_ok = 1.0 }
artifacts = [{ source = "/evidence/steps/event-000", destination = "evidence", service = "world-controller" }, { source = "/evidence/stages/stage-00", destination = "evidence-stage-00", service = "world-controller" }]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-000"
VIRTUAL_STAGE = "0"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "u0"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-000 0 u0 1"
