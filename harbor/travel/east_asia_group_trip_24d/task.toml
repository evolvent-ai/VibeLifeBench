schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/east-asia-group-trip-24d"
description = "A self-contained 28-step Harbor task for coordinating a four-person trip from Shanghai through Tokyo and Seoul, including travel documents, bookings, health monitoring, incident response, shared expenses, and a final retrospective."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "group-travel", "cross-border", "flights", "hotels", "health-monitoring", "budget", "incident-response"]

[metadata]
difficulty = "hard"
category = "travel"
tags = ["long-horizon", "multi-step", "cross-border", "multi-city", "health-monitoring", "shared-expenses", "incident-response"]
source_task = "east_asia_group_trip_24d"
source_event_count = 35
mutation_event_count = 7
virtual_stage_count = 22
harbor_step_count = 28
release_count = 7
stage_boundary_count = 22
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Travel Operations"
occupation = "Group Travel Coordinator"
onet_skills = ["Active Listening", "Critical Thinking", "Information Ordering", "Monitoring", "Time Management", "Judgment and Decision Making"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 40
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email", "flight-bookings", "hotel-bookings", "health-records", "banking-records"]
deliverables = ["trip journal", "traveler and document register", "flight and hotel bookings", "calendar schedule", "health monitoring plan", "shared-expense ledger", "incident log", "final retrospective"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
