services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
    volumes:
    - workspace-state:/workspace
    - agent-logs:/logs/agent
    - eval-evidence:/harbor/evidence:ro
    - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,::1,calendar,email,flight-booking,flight_booking,hotel-booking,hotel_booking,localhost,maps,notion,weather,workspace-init,workspace_init,world-controller,world_controller
      no_proxy: 127.0.0.1,::1,calendar,email,flight-booking,flight_booking,hotel-booking,hotel_booking,localhost,maps,notion,weather,workspace-init,workspace_init,world-controller,world_controller
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
    - workspace-state:/target
    restart: 'no'
  calendar:
    build:
      context: ./servers/calendar_mock
    volumes:
    - ./seeds/calendar:/env-seed:ro
    - calendar-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  email:
    build:
      context: ./servers/email_mock
    volumes:
    - ./seeds/email:/env-seed:ro
    - email-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  flight-booking:
    build:
      context: ./servers/flight_booking_mock
    volumes:
    - ./seeds/flight_booking:/env-seed:ro
    - flight_booking-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  hotel-booking:
    build:
      context: ./servers/hotel_booking_mock_task
    volumes:
    - ./seeds/hotel_booking:/env-seed:ro
    - hotel_booking-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  maps:
    build:
      context: ./servers/maps_mock
    volumes:
    - ./seeds/maps:/env-seed:ro
    - maps-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  notion:
    build:
      context: ./servers/notion_mock
    volumes:
    - ./seeds/notion:/env-seed:ro
    - notion-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  weather:
    build:
      context: ./servers/weather_mock
    volumes:
    - ./seeds/weather:/env-seed:ro
    - weather-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    depends_on:
      calendar:
        condition: service_healthy
      email:
        condition: service_healthy
      flight-booking:
        condition: service_healthy
      hotel-booking:
        condition: service_healthy
      maps:
        condition: service_healthy
      notion:
        condition: service_healthy
      weather:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      CLOCK_TOKEN: galapagos-no-us-transit-clock-20260825
      HEALTH_TOKEN: galapagos-no-us-transit-health-20260825
      SCENARIO_CLOCK_REQUIRED: '1'
    volumes:
    - calendar-env:/calendar-env
    - email-env:/email-env
    - flight_booking-env:/flight_booking-env
    - hotel_booking-env:/hotel_booking-env
    - maps-env:/maps-env
    - notion-env:/notion-env
    - weather-env:/weather-env
    - workspace-state:/workspace-source:ro
    - controller-state:/controller-state
    - eval-evidence:/evidence
    - world-clock:/world-clock
    expose:
    - '8090'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',
        timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
volumes:
  workspace-state: null
  agent-logs: null
  eval-evidence: null
  world-clock: null
  controller-state: null
  calendar-env: null
  email-env: null
  flight_booking-env: null
  hotel_booking-env: null
  maps-env: null
  notion-env: null
  weather-env: null
