schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/galapagos-no-us-transit"
description = "A 42-step Shanghai to Ecuador and Galapagos workshop travel-management task."
authors = [{ name = "VibeLifeBench" }]
keywords = ["multi-step", "travel", "galapagos", "flight", "risk", "budget"]

[metadata]
difficulty = "hard"
category = "travel"
tags = ["long-horizon", "international-travel", "galapagos", "flight-disruption", "budget-splitting"]
source_task = "galapagos_no_us_transit"
virtual_stage_count = 25
harbor_step_count = 42
source_scoring = "flat-pool"
source_event_count = 66
mutation_event_count = 24
release_count = 23
stage_boundary_count = 25
server_count = 7

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
workdir = "/workspace"

[[steps]]
