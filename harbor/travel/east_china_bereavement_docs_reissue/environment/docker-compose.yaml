services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      banking:
        condition: service_healthy
      calendar:
        condition: service_healthy
      email:
        condition: service_healthy
      flight-booking:
        condition: service_healthy
      hotel-booking:
        condition: service_healthy
      legal-search:
        condition: service_healthy
      maps:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
      rail-booking:
        condition: service_healthy
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,::1,banking,calendar,email,flight-booking,flight_booking,hotel-booking,hotel_booking,legal-search,legal_search,localhost,maps,notification-hub,notification_hub,notion,rail-booking,rail_booking,workspace-init,workspace_init,world-controller,world_controller
      no_proxy: 127.0.0.1,::1,banking,calendar,email,flight-booking,flight_booking,hotel-booking,hotel_booking,legal-search,legal_search,localhost,maps,notification-hub,notification_hub,notion,rail-booking,rail_booking,workspace-init,workspace_init,world-controller,world_controller
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
      - workspace-state:/target
    restart: "no"

  banking:
    build:
      context: ./servers/banking_mock
    volumes:
      - ./seeds/banking:/env-seed:ro
      - banking-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: &mock-health
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
  calendar:
    build: {context: ./servers/calendar_mock}
    volumes: ["./seeds/calendar:/env-seed:ro", "calendar-env:/env", "world-clock:/world-clock:ro"]
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
  email:
    build: {context: ./servers/email_mock}
    volumes: ["./seeds/email:/env-seed:ro", "email-env:/env", "world-clock:/world-clock:ro"]
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
  flight-booking:
    build: {context: ./servers/flight_booking_mock}
    volumes: ["./seeds/flight_booking:/env-seed:ro", "flight-booking-env:/env", "world-clock:/world-clock:ro"]
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
  hotel-booking:
    build: {context: ./servers/hotel_booking_mock_task}
    volumes: ["./seeds/hotel_booking:/env-seed:ro", "hotel-booking-env:/env", "world-clock:/world-clock:ro"]
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
  legal-search:
    build: {context: ./servers/legal_search_mock}
    volumes: ["./seeds/legal_search:/env-seed:ro", "legal-search-env:/env", "world-clock:/world-clock:ro"]
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
  maps:
    build: {context: ./servers/maps_mock}
    volumes: ["./seeds/maps:/env-seed:ro", "maps-env:/env", "world-clock:/world-clock:ro"]
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
  notification-hub:
    build: {context: ./servers/notification_hub_mock}
    volumes: ["./seeds/notification_hub:/env-seed:ro", "notification-hub-env:/env", "world-clock:/world-clock:ro"]
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
  notion:
    build: {context: ./servers/notion_mock}
    volumes: ["./seeds/notion:/env-seed:ro", "notion-env:/env", "world-clock:/world-clock:ro"]
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
  rail-booking:
    build: {context: ./servers/rail_booking_mock}
    volumes: ["./seeds/rail_booking:/env-seed:ro", "rail-booking-env:/env", "world-clock:/world-clock:ro"]
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}

  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      banking: {condition: service_healthy}
      calendar: {condition: service_healthy}
      email: {condition: service_healthy}
      flight-booking: {condition: service_healthy}
      hotel-booking: {condition: service_healthy}
      legal-search: {condition: service_healthy}
      maps: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
      rail-booking: {condition: service_healthy}
    volumes:
      - banking-env:/banking-env
      - calendar-env:/calendar-env
      - email-env:/email-env
      - flight-booking-env:/flight-booking-env
      - hotel-booking-env:/hotel-booking-env
      - legal-search-env:/legal-search-env
      - maps-env:/maps-env
      - notification-hub-env:/notification-hub-env
      - notion-env:/notion-env
      - rail-booking-env:/rail-booking-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: ["8090"]
    environment:
      HEALTH_TOKEN: east-china-health-6fd1289b
      CLOCK_TOKEN: east-china-clock-9f0243a86b4fc38a
      WORLD_CLOCK_FILE: /world-clock/current.json
      WORLD_CLOCK_REQUIRED: "1"
      NO_PROXY: "world-controller,banking,calendar,email,flight-booking,hotel-booking,legal-search,maps,notification-hub,notion,rail-booking,localhost,127.0.0.1"
      no_proxy: "world-controller,banking,calendar,email,flight-booking,hotel-booking,legal-search,maps,notification-hub,notion,rail-booking,localhost,127.0.0.1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

volumes:
  workspace-state:
  banking-env:
  calendar-env:
  email-env:
  flight-booking-env:
  hotel-booking-env:
  legal-search-env:
  maps-env:
  notification-hub-env:
  notion-env:
  rail-booking-env:
  controller-state:
  eval-evidence:
  world-clock:
