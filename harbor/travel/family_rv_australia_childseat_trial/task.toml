schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "travel/family-rv-australia-childseat-trial"
description = "A self-contained 29-step Harbor task for coordinating a family motorhome trial across Australia with child safety, right-hand-drive adaptation, insurance, weather, bookings, budget, visa boundaries, and reconciliation."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "family-travel", "Australia", "motorhome", "child-safety", "right-hand-drive", "insurance", "weather", "budget", "authorization"]

[metadata]
difficulty = "hard"
category = "travel"
tags = ["long-horizon", "multi-step", "family", "Australia", "motorhome", "child-safety", "right-hand-drive", "insurance", "weather", "budget", "authorization"]
source_task = "family_rv_australia_childseat_trial"
source_event_count = 39
mutation_event_count = 10
virtual_stage_count = 24
harbor_step_count = 29
release_count = 9
stage_boundary_count = 22
server_count = 10
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Travel and Hospitality"
occupation = "Family Travel Coordinator"
onet_skills = ["Monitoring", "Information Ordering", "Time Management", "Judgment and Decision Making", "Risk Assessment"]

[metadata.estimates]
task_completion_hours = 14.0
task_creation_hours = 48.0

[metadata.resources]
input_file_count = 5
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email", "flight-booking", "hotel-booking", "motorhome-booking", "visa-records", "expense-ledger"]
