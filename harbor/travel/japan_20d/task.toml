schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "travel/japan-20d"
description = "A self-contained 31-step Harbor task for planning, booking, monitoring, and adapting a 16-day Japan family trip across 24 virtual stages."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "travel", "family-trip", "Japan", "budget", "medical-safety", "disruption-management", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "travel"
tags = ["long-horizon", "multi-step", "family-travel", "budget-control", "medical-safety", "weather-monitoring", "disruption-handling", "privacy", "authorization"]
source_task = "japan_20d"
source_event_count = 38
mutation_event_count = 7
virtual_stage_count = 24
harbor_step_count = 31
release_count = 7
stage_boundary_count = 24
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Travel operations"
occupation = "Family travel coordinator"
onet_skills = ["monitoring", "planning", "information ordering", "judgment and decision making", "time management", "risk assessment"]

[metadata.estimates]
task_completion_hours = 14.0
task_creation_hours = 44.0

[metadata.resources]
input_file_count = 7
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 7
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email-drafts", "booking-records"]
deliverables = ["trip itinerary", "expense ledger", "packing and medication briefing", "trip journal", "calendar and reminders", "booking confirmations", "risk and authorization log"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
