services:
  main:
    build: {context: ., dockerfile: Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      world-controller: {condition: service_healthy}
      calendar: {condition: service_healthy}
      credit-card: {condition: service_healthy}
      email: {condition: service_healthy}
      flight-booking: {condition: service_healthy}
      hotel-booking: {condition: service_healthy}
      maps: {condition: service_healthy}
      notion: {condition: service_healthy}
      rail-booking: {condition: service_healthy}
      review-platform: {condition: service_healthy}
      weather: {condition: service_healthy}
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
      - agent-logs:/logs/agent
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: &no-proxy localhost,127.0.0.1,::1,world-controller,calendar,credit-card,email,flight-booking,hotel-booking,maps,notion,rail-booking,review-platform,weather
      no_proxy: *no-proxy

  workspace-init:
    build: {context: ., dockerfile: workspace-init/Dockerfile}
    volumes: [workspace-state:/target]
    restart: "no"

  calendar:
    build: {context: ./servers/calendar_mock}
    volumes: [./seeds/calendar:/env-seed:ro, calendar-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: &mock-env
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: *no-proxy
      no_proxy: *no-proxy
    healthcheck: &health
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  credit-card:
    build: {context: ./servers/credit_card_mock}
    volumes: [./seeds/credit_card:/env-seed:ro, credit-card-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: *mock-env
    healthcheck: *health

  email:
    build: {context: ./servers/email_mock}
    volumes: [./seeds/email:/env-seed:ro, email-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: *mock-env
    healthcheck: *health

  flight-booking:
    build: {context: ./servers/flight_booking_mock}
    volumes: [./seeds/flight_booking:/env-seed:ro, flight-booking-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: *mock-env
    healthcheck: *health

  hotel-booking:
    build: {context: ./servers/hotel_booking_mock}
    volumes: [./seeds/hotel_booking:/env-seed:ro, hotel-booking-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: *mock-env
    healthcheck: *health

  maps:
    build: {context: ./servers/maps_mock}
    volumes: [./seeds/maps:/env-seed:ro, maps-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: *mock-env
    healthcheck: *health

  notion:
    build: {context: ./servers/notion_mock}
    volumes: [./seeds/notion:/env-seed:ro, notion-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: *mock-env
    healthcheck: *health

  rail-booking:
    build: {context: ./servers/rail_booking_mock}
    volumes: [./seeds/rail_booking:/env-seed:ro, rail-booking-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: *mock-env
    healthcheck: *health

  review-platform:
    build: {context: ./servers/review_platform_mock}
    volumes: [./seeds/review_platform:/env-seed:ro, review-platform-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: *mock-env
    healthcheck: *health

  weather:
    build: {context: ./servers/weather_mock}
    volumes: [./seeds/weather:/env-seed:ro, weather-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    environment: *mock-env
    healthcheck: *health

  world-controller:
    build: {context: ., dockerfile: world-controller/Dockerfile}
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      CLOCK_TOKEN: italy-wedding-guest-strike-22d-clock
      HEALTH_TOKEN: italy-wedding-health-9d38c1e72a4f
      NO_PROXY: *no-proxy
      no_proxy: *no-proxy
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      calendar: {condition: service_healthy}
      credit-card: {condition: service_healthy}
      email: {condition: service_healthy}
      flight-booking: {condition: service_healthy}
      hotel-booking: {condition: service_healthy}
      maps: {condition: service_healthy}
      notion: {condition: service_healthy}
      rail-booking: {condition: service_healthy}
      review-platform: {condition: service_healthy}
      weather: {condition: service_healthy}
    volumes:
      - world-clock:/world-clock
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - controller-state:/controller-state
      - calendar-env:/calendar-env
      - credit-card-env:/credit-card-env
      - email-env:/email-env
      - flight-booking-env:/flight-booking-env
      - hotel-booking-env:/hotel-booking-env
      - maps-env:/maps-env
      - notion-env:/notion-env
      - rail-booking-env:/rail-booking-env
      - review-platform-env:/review-platform-env
      - weather-env:/weather-env
    expose: ["8090"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

volumes:
  workspace-state: {}
  eval-evidence: {}
  world-clock: {}
  controller-state: {}
  agent-logs: {}
  calendar-env: {}
  credit-card-env: {}
  email-env: {}
  flight-booking-env: {}
  hotel-booking-env: {}
  maps-env: {}
  notion-env: {}
  rail-booking-env: {}
  review-platform-env: {}
  weather-env: {}
