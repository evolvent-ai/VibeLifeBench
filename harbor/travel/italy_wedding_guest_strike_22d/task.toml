authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "travel", "italy", "wedding", "flights", "hotels", "rail", "privacy", "authorization", "budget"]

[metadata]
difficulty = "hard"
category = "travel"
tags = ["long-horizon", "multi-step", "travel", "wedding", "budget", "privacy", "authorization", "allergy-safety"]
source_task = "italy_wedding_guest_strike_22d"
source_event_count = 37
virtual_stage_count = 22
harbor_step_count = 23
release_count = 15
stage_boundary_count = 22
server_count = 10
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"

[metadata.taxonomy]
sector = "Travel and Hospitality"
occupation = "Travel Planning and Coordination"
onet_skills = ["Active Listening", "Critical Thinking", "Monitoring", "Time Management", "Judgment and Decision Making"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 20
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 7
deliverable_formats = ["markdown"]
deliverables = ["audit journal", "trip evidence log", "trip risk register", "authorization ledger", "budget and booking state", "heartbeat", "final travel packet"]

