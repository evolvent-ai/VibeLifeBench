schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "local/bali-22-day-family-trip"
description = "A 32-step, 24-stage Harbor task for coordinating a 22-day Bali family trip with pregnancy, accessibility, weather, and travel disruption constraints."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "travel", "Bali", "pregnancy-safety", "accessibility", "weather", "budget"]

[metadata]
difficulty = "hard"
category = "travel"
tags = ["long-horizon", "multi-day", "proactive", "pregnancy-safety", "accessibility", "volcanic-disruption", "budget"]
source_task = "bali_22d"
virtual_stage_count = 24
harbor_step_count = 32
source_event_count = 50
release_count = 16
source_scoring = "flat-pool"

[metadata.taxonomy]
sector = "travel and hospitality"
occupation = "travel planning assistant"
onet_skills = ["planning", "risk assessment", "customer service"]

[metadata.estimates]
task_completion_hours = 8.0
task_creation_hours = 12.0

[metadata.resources]
input_file_count = 0
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 0
deliverable_formats = ["structured updates", "checklists"]
deliverables = ["trip coordination record"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

