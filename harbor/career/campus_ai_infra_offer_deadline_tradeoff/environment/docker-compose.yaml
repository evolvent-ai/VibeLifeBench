services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      calendar:
        condition: service_healthy
      content-platform:
        condition: service_healthy
      email:
        condition: service_healthy
      job-board:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
    volumes:
    - workspace-state:/workspace
    - eval-evidence:/harbor/evidence:ro
    - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: localhost,127.0.0.1,::1,world-controller,calendar,content-platform,email,job-board,notification-hub,notion
      no_proxy: localhost,127.0.0.1,::1,world-controller,calendar,content-platform,email,job-board,notification-hub,notion
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
    - workspace-state:/target
    restart: 'no'
  calendar:
    build:
      context: ./servers/calendar_mock
    volumes:
    - ./seeds/calendar:/env-seed:ro
    - calendar-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: &id001
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  content-platform:
    build:
      context: ./servers/content_platform_mock
    volumes:
    - ./seeds/content_platform:/env-seed:ro
    - content-platform-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  email:
    build:
      context: ./servers/email_mock
    volumes:
    - ./seeds/email:/env-seed:ro
    - email-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  job-board:
    build:
      context: ./servers/job_board_mock
    volumes:
    - ./seeds/job_board:/env-seed:ro
    - job-board-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  notification-hub:
    build:
      context: ./servers/notification_hub_mock
    volumes:
    - ./seeds/notification_hub:/env-seed:ro
    - notification-hub-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  notion:
    build:
      context: ./servers/notion_mock
    volumes:
    - ./seeds/notion:/env-seed:ro
    - notion-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    environment:
      HEALTH_TOKEN: campus_ai_infra_offer_deadline_tradeoff-health-token
      WORLD_CLOCK_FILE: /world-clock/current.json
      CLOCK_TOKEN: campus_ai_infra_offer_deadline_tradeoff-clock-token
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      calendar:
        condition: service_healthy
      content-platform:
        condition: service_healthy
      email:
        condition: service_healthy
      job-board:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
    volumes:
    - calendar-env:/calendar-env
    - content-platform-env:/content-platform-env
    - email-env:/email-env
    - job-board-env:/job-board-env
    - notification-hub-env:/notification-hub-env
    - notion-env:/notion-env
    - controller-state:/controller-state
    - workspace-state:/workspace-source:ro
    - eval-evidence:/evidence
    - world-clock:/world-clock
    expose:
    - '8090'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',
        timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
volumes:
  workspace-state: null
  calendar-env: null
  content-platform-env: null
  email-env: null
  job-board-env: null
  notification-hub-env: null
  notion-env: null
  controller-state: null
  eval-evidence: null
  world-clock: null
