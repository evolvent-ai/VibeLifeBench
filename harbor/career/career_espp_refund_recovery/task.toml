schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/career-espp-refund-recovery"
description = "Self-contained 33-step Harbor task for reconciling an employee share plan redemption dispute while restarting a Shanghai backend career."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "career", "equity", "contract", "reconciliation", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "career"
tags = ["long-horizon", "multi-step", "equity", "contract", "banking", "brokerage", "legal-search"]
source_task = "career_espp_refund_recovery"
virtual_stage_count = 24
harbor_step_count = 33
source_event_count = 43
mutation_event_count = 10
release_count = 10
stage_boundary_count = 24
server_count = 7
source_scoring = "flat-pool"
web_search = "disabled"

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
name = "banking"
transport = "streamable-http"
url = "http://banking:8000/mcp"

[[environment.mcp_servers]]
name = "brokerage"
