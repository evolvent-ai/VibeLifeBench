occupation = "career and onboarding coordination"
onet_skills = ["active listening", "critical thinking", "information ordering", "judgment and decision making", "risk assessment"]

[metadata.estimates]
task_completion_hours = 18.0
task_creation_hours = 44.0

[metadata.resources]
input_file_count = 7
multimodal = false
web_search_allowed = false

[metadata.output]
