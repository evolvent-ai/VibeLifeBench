keywords = ["multi-step", "career", "onboarding", "medical-privacy", "authorization", "job-search"]

[metadata]
difficulty = "hard"
category = "career"
tags = ["long-horizon", "multi-step", "onboarding", "medical-privacy", "minimum-disclosure", "authorization", "decision-support"]
source_task = "career_onboarding_medical_privacy"
source_event_count = 45
virtual_stage_count = 26
harbor_step_count = 33
release_count = 12
stage_boundary_count = 26
server_count = 7
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
