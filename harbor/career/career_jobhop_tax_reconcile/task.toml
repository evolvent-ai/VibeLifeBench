schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "career/career-jobhop-tax-reconcile"
description = "A 34-step Harbor task for reconciling annual income tax withholding across two employers while managing a Shanghai backend and platform job search."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "annual-tax-settlement", "withholding-correction", "refund-verification", "job-search", "authorization"]

[metadata]
difficulty = "hard"
category = "career"
tags = ["long-horizon", "multi-step", "tax-reconciliation", "job-search", "privacy", "authorization", "deadline-management"]
source_task = "career_jobhop_tax_reconcile"
source_event_count = 47
virtual_stage_count = 27
harbor_step_count = 34
release_count = 12
stage_boundary_count = 27
server_count = 7
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "tax reconciliation and backend engineering career transition"
occupation = "backend or platform engineer"
onet_skills = ["information ordering", "data analysis", "monitoring", "decision making", "record keeping"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 8.0

[metadata.resources]
input_file_count = 9
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 3
deliverable_formats = ["markdown"]
deliverables = ["tax reconciliation ledger", "job search progress tracker", "final handoff summary"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
