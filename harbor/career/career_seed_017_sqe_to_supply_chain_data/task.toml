schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "career/career-seed-017-sqe-to-supply-chain-data"
description = "A 30-step Harbor task covering an SQE professional's transition into supply chain data analytics, with job screening, privacy controls, schedule conflicts, compensation analysis, and offer decisions."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "career-transition", "supply-chain-data", "SQE", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "career"
tags = ["long-horizon", "multi-step", "manufacturing", "supply-chain-data", "job-search", "privacy", "authorization", "schedule-conflict", "salary-floor"]
source_task = "career_seed_017_sqe_to_supply_chain_data"
source_event_count = 39
virtual_stage_count = 23
harbor_step_count = 30
release_count = 10
stage_boundary_count = 20
server_count = 6
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "manufacturing and supply chain analytics"
occupation = "supplier quality and supply chain data analyst"
onet_skills = ["data analysis", "quality control analysis", "monitoring", "information ordering", "decision making"]

[metadata.estimates]
task_completion_hours = 15.0
task_creation_hours = 45.0

[metadata.resources]
input_file_count = 11
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email-drafts", "job-applications"]
deliverables = ["opportunity tracker", "constraint and risk ledger", "de-identified case framework", "interview availability plan", "application evidence", "communication drafts", "offer comparison", "final decision package"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

