VIRTUAL_STAGE = "23"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "S23_action_state_closeout"
INCLUDE_ALL_BUCKETS = "1"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-027 23 S23_action_state_closeout 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-027"
