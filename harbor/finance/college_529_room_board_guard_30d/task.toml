schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "finance/college-529-room-board-guard-30d"
description = "A self-contained 28-step Harbor task for determining qualified 529 room-and-board costs while preserving tuition funds, separating household activity, and observing explicit financial authorization boundaries."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "personal-finance", "529-plan", "room-and-board", "tuition-reserve", "scholarship", "authorization", "evidence"]

[metadata]
difficulty = "hard"
category = "finance"
tags = ["long-horizon", "event-driven", "529-plan", "education-funding", "room-and-board", "tuition-reserve", "authorization", "source-verification"]
source_task = "college_529_room_board_guard_30d"
source_event_count = 35
mutation_event_count = 7
virtual_stage_count = 24
harbor_step_count = 28
release_count = 7
stage_boundary_count = 24
server_count = 6
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Personal Finance and Education Funding"
occupation = "Personal Financial Planning"
onet_skills = ["Active Listening", "Critical Thinking", "Information Ordering", "Monitoring", "Time Management", "Judgment and Decision Making"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 6
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 5
deliverable_formats = ["markdown", "notion-records", "calendar-events"]
deliverables = ["eligibility evidence record", "qualified-cost calculation", "funding decision record", "action ledger", "next-review schedule"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
