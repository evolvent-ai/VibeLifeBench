authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "personal-finance", "inherited-ira", "beneficiary", "tax-withholding", "household-liquidity", "protected-reserve", "authorization", "long-horizon"]

[metadata]
difficulty = "hard"
category = "finance"
