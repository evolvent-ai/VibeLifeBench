schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "finance/divorce-asset-rebuild-30d"
description = "A self-contained 23-step Harbor task for rebuilding a post-divorce asset plan across cash flow, debt, insurance, education reserves, pension decisions, and final archival review."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "personal-finance", "divorce-settlement", "cash-flow", "credit-cards", "mortgage", "insurance", "pension", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "personal_finance"
tags = ["long-horizon", "asset-rebuild", "cash-flow", "credit-card-debt", "mortgage", "insurance", "education-reserve", "pension", "authorization"]
source_task = "divorce_asset_rebuild_30d"
source_event_count = 31
mutation_event_count = 8
virtual_stage_count = 23
harbor_step_count = 23
release_count = 8
stage_boundary_count = 23
server_count = 6
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Personal Finance"
occupation = "Personal Financial Planning"
onet_skills = ["Critical Thinking", "Information Ordering", "Monitoring", "Time Management", "Judgment and Decision Making"]

[metadata.estimates]
task_completion_hours = 10.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 0
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "notion-records", "calendar-events"]
deliverables = ["asset and liability ledger", "30-day cash-flow plan", "debt and mortgage review", "insurance status register", "education reserve analysis", "calendar review plan", "pension comparison", "final archive and conclusion"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
