services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      banking:
        condition: service_healthy
      brokerage:
        condition: service_healthy
      calendar:
        condition: service_healthy
      credit-card:
        condition: service_healthy
      email:
        condition: service_healthy
      notion:
        condition: service_healthy
    volumes:
    - workspace-state:/workspace
    - eval-evidence:/harbor/evidence:ro
    - world-clock:/world-clock:ro
    - agent-logs:/logs/agent
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,::1,banking,brokerage,calendar,credit-card,email,notion,workspace-init,world-controller
      no_proxy: 127.0.0.1,::1,banking,brokerage,calendar,credit-card,email,notion,workspace-init,world-controller
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
    - workspace-state:/target
    restart: 'no'
  banking:
    build:
      context: ./servers/banking_mock
    volumes:
    - ./seeds/banking:/env-seed:ro
    - banking-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: banking,localhost,127.0.0.1
      no_proxy: banking,localhost,127.0.0.1
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  brokerage:
    build:
      context: ./servers/brokerage_mock
    volumes:
    - ./seeds/brokerage:/env-seed:ro
    - brokerage-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: brokerage,localhost,127.0.0.1
      no_proxy: brokerage,localhost,127.0.0.1
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  calendar:
    build:
      context: ./servers/calendar_mock
    volumes:
    - ./seeds/calendar:/env-seed:ro
    - calendar-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: calendar,localhost,127.0.0.1
      no_proxy: calendar,localhost,127.0.0.1
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  credit-card:
    build:
      context: ./servers/credit_card_mock
    volumes:
    - ./seeds/credit_card:/env-seed:ro
    - credit_card-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: credit-card,localhost,127.0.0.1
      no_proxy: credit-card,localhost,127.0.0.1
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  email:
    build:
      context: ./servers/email_mock
    volumes:
    - ./seeds/email:/env-seed:ro
    - email-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: email,localhost,127.0.0.1
      no_proxy: email,localhost,127.0.0.1
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  notion:
    build:
      context: ./servers/notion_mock
    volumes:
    - ./seeds/notion:/env-seed:ro
    - notion-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: notion,localhost,127.0.0.1
      no_proxy: notion,localhost,127.0.0.1
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    environment:
      HEALTH_TOKEN: ev-auto-balloon-health-6fd1289b
      WORLD_CLOCK_FILE: /world-clock/current.json
      CLOCK_TOKEN: ev_auto_balloon_refi_guard_30d-clock-token
      NO_PROXY: localhost,127.0.0.1,::1,world-controller,banking,brokerage,calendar,credit-card,email,notion
      no_proxy: localhost,127.0.0.1,::1,world-controller,banking,brokerage,calendar,credit-card,email,notion
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      banking:
        condition: service_healthy
      brokerage:
        condition: service_healthy
      calendar:
        condition: service_healthy
      credit-card:
        condition: service_healthy
      email:
        condition: service_healthy
      notion:
        condition: service_healthy
    volumes:
    - banking-env:/banking-env
    - brokerage-env:/brokerage-env
    - calendar-env:/calendar-env
    - credit_card-env:/credit_card-env
    - email-env:/email-env
    - notion-env:/notion-env
    - controller-state:/controller-state
    - workspace-state:/workspace-source:ro
    - eval-evidence:/evidence
    - world-clock:/world-clock
    expose:
    - '8090'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
volumes:
  workspace-state: {}
  banking-env: {}
  brokerage-env: {}
  calendar-env: {}
  credit_card-env: {}
  email-env: {}
  notion-env: {}
  controller-state: {}
  eval-evidence: {}
  world-clock: {}
  agent-logs: {}
