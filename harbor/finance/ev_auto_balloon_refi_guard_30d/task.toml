schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/ev_auto_balloon_refi_guard_30d"
description = "Thirty-day EV balloon refinance comparison with protected reserves, lender disclosures, authorized clarification messages, deadline tracking, and durable backend evidence."
authors = [{ name = "harbor-eval-maintainers" }]
keywords = ["multi-step", "finance", "auto-loan", "refinance", "authorization", "durable-state"]

[metadata]
difficulty = "hard"
category = "finance"
tags = ["finance", "long-horizon", "event-driven", "real-data", "auto-loan", "authorization-boundary", "durable-state"]
source_task = "ev_auto_balloon_refi_guard_30d"
virtual_stage_count = 24
harbor_step_count = 24
source_scoring = "flat-pool"

[agent]
timeout_sec = 14400.0
user = "root"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[solution.env]
VERIFY_STEP = "0"

[[steps]]
name = "event-000"
min_reward = { verifier_ok = 1.0 }
artifacts = [{ source = "/evidence/steps/event-000", destination = "evidence", service = "world-controller" }, { source = "/evidence/stages/stage-00", destination = "evidence-stage-00", service = "world-controller" }]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-000"
VIRTUAL_STAGE = "0"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "ev_kickoff"

