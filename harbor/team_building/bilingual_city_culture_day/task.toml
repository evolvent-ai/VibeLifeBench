schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "local/bilingual-city-culture-day"
description = "A 25-step Harbor task for planning and operating an inclusive bilingual city culture day in Yuexiu, Guangzhou, with vendor, budget, privacy, safety, accessibility, and post-event responsibilities."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "team-building", "event-planning", "bilingual", "accessibility", "privacy", "budget", "vendor-risk", "onsite-coordination"]

[metadata]
difficulty = "hard"
category = "team_building"
tags = ["long-horizon", "multi-step", "event-planning", "bilingual", "accessibility", "privacy", "safety", "authorization", "post-event-review"]
source_task = "bilingual_city_culture_day"
source_event_count = 42
mutation_event_count = 17
virtual_stage_count = 25
harbor_step_count = 25
release_count = 17
stage_boundary_count = 25
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "team building and event operations"
occupation = "corporate event coordinator"
onet_skills = ["active listening", "coordination", "monitoring", "planning", "judgment and decision making", "time management"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 10
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "csv", "notion-records", "calendar-events", "email", "notifications"]
deliverables = ["master event plan", "team roster", "risk register", "vendor shortlist", "budget ledger", "calendar schedule", "communication drafts", "post-event review"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

