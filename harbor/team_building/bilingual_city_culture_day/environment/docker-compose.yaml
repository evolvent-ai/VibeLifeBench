x-mock: &mock
  expose: ["8000"]
  healthcheck: &health
    test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
    interval: 2s
    timeout: 5s
    retries: 30
    start_period: 3s
  environment:
    WORLD_CLOCK_FILE: /world-clock/current.json

services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      world-controller: {condition: service_healthy}
      banking: {condition: service_healthy}
      calendar: {condition: service_healthy}
      email: {condition: service_healthy}
      maps: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
      review-platform: {condition: service_healthy}
      weather: {condition: service_healthy}
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: localhost,127.0.0.1,::1,world-controller,banking,calendar,email,maps,notification-hub,notion,review-platform,weather
      no_proxy: localhost,127.0.0.1,::1,world-controller,banking,calendar,email,maps,notification-hub,notion,review-platform,weather
  workspace-init:
    build: {context: ., dockerfile: workspace-init/Dockerfile}
    volumes:
      - workspace-state:/target
      - ./workspace:/seed:ro
    restart: "no"
  world-controller:
    build: {context: ., dockerfile: world-controller/Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      banking: {condition: service_healthy}
      calendar: {condition: service_healthy}
      email: {condition: service_healthy}
      maps: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
      review-platform: {condition: service_healthy}
      weather: {condition: service_healthy}
    environment:
      HEALTH_TOKEN: bilingual-city-health-7f3b9a
      CLOCK_TOKEN: bilingual-city-clock-8c4d2e1f
      WORLD_CLOCK_FILE: /world-clock/current.json
    volumes:
      - banking-env:/banking-env
      - calendar-env:/calendar-env
      - email-env:/email-env
      - maps-env:/maps-env
      - notification-hub-env:/notification-hub-env
      - notion-env:/notion-env
      - review-platform-env:/review-platform-env
      - weather-env:/weather-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: ["8090"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  banking:
    <<: *mock
    build: {context: ./servers/banking_mock}
    volumes: [./seeds/banking:/env-seed:ro, banking-env:/env, world-clock:/world-clock:ro]
  calendar:
    <<: *mock
    build: {context: ./servers/calendar_mock}
    volumes: [./seeds/calendar:/env-seed:ro, calendar-env:/env, world-clock:/world-clock:ro]
  email:
    <<: *mock
    build: {context: ./servers/email_mock}
    volumes: [./seeds/email:/env-seed:ro, email-env:/env, world-clock:/world-clock:ro]
  maps:
    <<: *mock
    build: {context: ./servers/maps_mock}
    volumes: [./seeds/maps:/env-seed:ro, maps-env:/env, world-clock:/world-clock:ro]
  notification-hub:
    <<: *mock
    build: {context: ./servers/notification_hub_mock}
    volumes: [./seeds/notification_hub:/env-seed:ro, notification-hub-env:/env, world-clock:/world-clock:ro]
  notion:
    <<: *mock
    build: {context: ./servers/notion_mock}
    volumes: [./seeds/notion:/env-seed:ro, notion-env:/env, world-clock:/world-clock:ro]
  review-platform:
    <<: *mock
    build: {context: ./servers/review_platform_mock}
    volumes: [./seeds/review_platform:/env-seed:ro, review-platform-env:/env, world-clock:/world-clock:ro]
  weather:
    <<: *mock
    build: {context: ./servers/weather_mock}
    volumes: [./seeds/weather:/env-seed:ro, weather-env:/env, world-clock:/world-clock:ro]

volumes:
  workspace-state: {}
  controller-state: {}
  eval-evidence: {}
  world-clock: {}
  banking-env: {}
  calendar-env: {}
  email-env: {}
  maps-env: {}
  notification-hub-env: {}
  notion-env: {}
  review-platform-env: {}
  weather-env: {}
