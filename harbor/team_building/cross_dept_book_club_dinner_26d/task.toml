authors = [{ name = "task-factory" }]
keywords = ["multi-step", "book-club", "event-planning", "procurement", "budget-controls", "privacy", "guest-coordination"]

[metadata]
difficulty = "hard"
category = "team_building"
tags = ["team-building", "book-club", "procurement", "budget-boundary", "privacy", "long-horizon", "multi-source-verification", "guest-coordination"]
