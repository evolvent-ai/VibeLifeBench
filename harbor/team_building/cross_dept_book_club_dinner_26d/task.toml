  { source = "/evidence/stages/stage-25", destination = "evidence-stage-25", service = "world-controller" },
]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-025"
VIRTUAL_STAGE = "25"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "S25_user_feedback_archive"
INCLUDE_ALL_BUCKETS = "1"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-025 25 S25_user_feedback_archive 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-025"
