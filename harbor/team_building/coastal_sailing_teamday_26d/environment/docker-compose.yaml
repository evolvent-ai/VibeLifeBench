services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      banking:
        condition: service_healthy
      calendar:
        condition: service_healthy
      car-rental:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
      email:
        condition: service_healthy
      maps:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
      review-platform:
        condition: service_healthy
      weather:
        condition: service_healthy
    volumes:
    - workspace-state:/workspace
    - eval-evidence:/harbor/evidence:ro
    - world-clock:/world-clock:ro
    - agent-logs:/logs/agent
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: localhost,127.0.0.1,::1,world-controller,banking,calendar,car-rental,ecommerce,email,maps,notification-hub,notion,review-platform,weather
      no_proxy: localhost,127.0.0.1,::1,world-controller,banking,calendar,car-rental,ecommerce,email,maps,notification-hub,notion,review-platform,weather
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
    - workspace-state:/target
    restart: 'no'
  banking:
    build:
      context: ./servers/banking_mock
    volumes:
    - ./seeds/banking:/env-seed:ro
    - banking-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: localhost,127.0.0.1,::1,world-controller,banking,calendar,car-rental,ecommerce,email,maps,notification-hub,notion,review-platform,weather
      no_proxy: localhost,127.0.0.1,::1,world-controller,banking,calendar,car-rental,ecommerce,email,maps,notification-hub,notion,review-platform,weather
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  calendar:
    build:
      context: ./servers/calendar_mock
    volumes:
    - ./seeds/calendar:/env-seed:ro
    - calendar-env:/env
    - world-clock:/world-clock:ro
