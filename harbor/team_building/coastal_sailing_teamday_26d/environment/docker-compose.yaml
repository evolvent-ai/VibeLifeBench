    - notification-hub-env:/notification-hub-env
    - notion-env:/notion-env
    - review-platform-env:/review-platform-env
    - weather-env:/weather-env
    expose:
    - '8090'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
volumes:
  workspace-state: null
  eval-evidence: null
  world-clock: null
  controller-state: null
  agent-logs: null
  banking-env: null
  calendar-env: null
  car-rental-env: null
  ecommerce-env: null
  email-env: null
  maps-env: null
  notification-hub-env: null
  notion-env: null
  review-platform-env: null
  weather-env: null
