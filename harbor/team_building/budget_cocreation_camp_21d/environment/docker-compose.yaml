services:
  main:
    build: {context: ., dockerfile: Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      world-controller: {condition: service_healthy}
      banking: {condition: service_healthy}
      calendar: {condition: service_healthy}
      ecommerce: {condition: service_healthy}
      email: {condition: service_healthy}
      maps: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
      review-platform: {condition: service_healthy}
    volumes: [workspace-state:/workspace, eval-evidence:/harbor/evidence:ro, world-clock:/world-clock:ro]
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,::1,localhost,banking,calendar,ecommerce,email,maps,notification-hub,notion,review-platform,world-controller
      no_proxy: 127.0.0.1,::1,localhost,banking,calendar,ecommerce,email,maps,notification-hub,notion,review-platform,world-controller

  workspace-init:
    build: {context: ., dockerfile: workspace-init/Dockerfile}
    volumes: [workspace-state:/target]
    restart: "no"

  banking: &mock
    build: {context: ./servers/banking_mock}
    volumes: [./seeds/banking:/env-seed:ro, ./runtime-patches:/runtime-patches:ro, banking-env:/env, world-clock:/world-clock:ro]
    expose: ["8000"]
    healthcheck: &mock-health
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json, PYTHONPATH: /runtime-patches}
  calendar:
    <<: *mock
    build: {context: ./servers/calendar_mock}
    volumes: [./seeds/calendar:/env-seed:ro, ./runtime-patches:/runtime-patches:ro, calendar-env:/env, world-clock:/world-clock:ro]
  ecommerce:
    <<: *mock
    build: {context: ./servers/ecommerce_mock}
    volumes: [./seeds/ecommerce:/env-seed:ro, ./runtime-patches:/runtime-patches:ro, ecommerce-env:/env, world-clock:/world-clock:ro]
  email:
    <<: *mock
    build: {context: ./servers/email_mock}
    volumes: [./seeds/email:/env-seed:ro, ./runtime-patches:/runtime-patches:ro, email-env:/env, world-clock:/world-clock:ro]
  maps:
    <<: *mock
    build: {context: ./servers/maps_mock}
    volumes: [./seeds/maps:/env-seed:ro, ./runtime-patches:/runtime-patches:ro, maps-env:/env, world-clock:/world-clock:ro]
  notification-hub:
    <<: *mock
    build: {context: ./servers/notification_hub_mock}
    volumes: [./seeds/notification_hub:/env-seed:ro, ./runtime-patches:/runtime-patches:ro, notification-hub-env:/env, world-clock:/world-clock:ro]
  notion:
    <<: *mock
    build: {context: ./servers/notion_mock}
    volumes: [./seeds/notion:/env-seed:ro, ./runtime-patches:/runtime-patches:ro, notion-env:/env, world-clock:/world-clock:ro]
  review-platform:
    <<: *mock
    build: {context: ./servers/review_platform_mock}
    volumes: [./seeds/review_platform:/env-seed:ro, ./runtime-patches:/runtime-patches:ro, review-platform-env:/env, world-clock:/world-clock:ro]

  world-controller:
    build: {context: ., dockerfile: world-controller/Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      banking: {condition: service_healthy}
      calendar: {condition: service_healthy}
      ecommerce: {condition: service_healthy}
      email: {condition: service_healthy}
      maps: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
      review-platform: {condition: service_healthy}
    volumes:
      - banking-env:/banking-env
      - calendar-env:/calendar-env
      - ecommerce-env:/ecommerce-env
      - email-env:/email-env
      - maps-env:/maps-env
      - notification-hub-env:/notification-hub-env
      - notion-env:/notion-env
      - review-platform-env:/review-platform-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: ["8090"]
    environment:
      HEALTH_TOKEN: budget-cocreation-camp-21d-health
      CLOCK_TOKEN: budget-cocreation-camp-21d-clock
      RELEASE_TOKEN: budget-cocreation-camp-21d-release
      WORLD_CLOCK_FILE: /world-clock/current.json
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

volumes:
  workspace-state:
  banking-env:
  calendar-env:
  ecommerce-env:
  email-env:
  maps-env:
  notification-hub-env:
  notion-env:
  review-platform-env:
  controller-state:
  eval-evidence:
  world-clock:
