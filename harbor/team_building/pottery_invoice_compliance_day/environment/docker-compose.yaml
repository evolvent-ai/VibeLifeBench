services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      calendar:
        condition: service_healthy
      credit-card:
        condition: service_healthy
      email:
        condition: service_healthy
      maps:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
      review-platform:
        condition: service_healthy
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
      - agent-logs:/logs/agent
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,::1,calendar,credit-card,credit_card,email,localhost,maps,notification-hub,notification_hub,notion,review-platform,review_platform,workspace-init,workspace_init,world-controller,world_controller
      no_proxy: 127.0.0.1,::1,calendar,credit-card,credit_card,email,localhost,maps,notification-hub,notification_hub,notion,review-platform,review_platform,workspace-init,workspace_init,world-controller,world_controller
      WORLD_CLOCK_REQUIRED: "1"
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
      - workspace-state:/target
    restart: "no"
  calendar:
    build:
      context: ./servers/calendar_mock
    volumes:
      - ./seeds/calendar:/env-seed:ro
      - calendar-env:/env
      - world-clock:/world-clock:ro
    environment: &clock-env
      WORLD_CLOCK_FILE: /world-clock/current.json
      WORLD_CLOCK_REQUIRED: "1"
    expose: ["8000"]
    healthcheck: &mock-health
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  credit-card:
    build:
      context: ./servers/credit_card_mock
    volumes:
      - ./seeds/credit_card:/env-seed:ro
      - credit_card-env:/env
      - world-clock:/world-clock:ro
    environment: *clock-env
    expose: ["8000"]
    healthcheck: *mock-health
  email:
    build:
      context: ./servers/email_mock
    volumes:
      - ./seeds/email:/env-seed:ro
      - email-env:/env
      - world-clock:/world-clock:ro
    environment: *clock-env
    expose: ["8000"]
    healthcheck: *mock-health
  maps:
    build:
      context: ./servers/maps_mock
    volumes:
      - ./seeds/maps:/env-seed:ro
      - maps-env:/env
      - world-clock:/world-clock:ro
    environment: *clock-env
    expose: ["8000"]
    healthcheck: *mock-health
  notification-hub:
    build:
      context: ./servers/notification_hub_mock
    volumes:
      - ./seeds/notification_hub:/env-seed:ro
      - notification_hub-env:/env
      - world-clock:/world-clock:ro
    environment: *clock-env
    expose: ["8000"]
    healthcheck: *mock-health
  notion:
    build:
      context: ./servers/notion_mock
    volumes:
      - ./seeds/notion:/env-seed:ro
      - notion-env:/env
      - world-clock:/world-clock:ro
    environment: *clock-env
    expose: ["8000"]
    healthcheck: *mock-health
  review-platform:
    build:
      context: ./servers/review_platform_mock
    volumes:
      - ./seeds/review_platform:/env-seed:ro
      - review_platform-env:/env
      - world-clock:/world-clock:ro
    environment: *clock-env
    expose: ["8000"]
    healthcheck: *mock-health
  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      calendar:
        condition: service_healthy
      credit-card:
        condition: service_healthy
      email:
        condition: service_healthy
      maps:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
      review-platform:
        condition: service_healthy
    environment:
      CLOCK_TOKEN: pottery_invoice_compliance_day-clock-token
      HEALTH_TOKEN: pottery_invoice_compliance_day-health-token
      WORLD_CLOCK_FILE: /world-clock/current.json
      WORLD_CLOCK_REQUIRED: "1"
    volumes:
      - calendar-env:/calendar-env
      - credit_card-env:/credit-card-env
      - email-env:/email-env
      - maps-env:/maps-env
      - notification_hub-env:/notification-hub-env
      - notion-env:/notion-env
      - review_platform-env:/review-platform-env
      - workspace-state:/workspace-source:ro
      - controller-state:/controller-state
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
volumes:
  workspace-state:
  calendar-env:
  credit_card-env:
  email-env:
  maps-env:
  notification_hub-env:
  notion-env:
  review_platform-env:
  controller-state:
  eval-evidence:
  world-clock:
  agent-logs:
