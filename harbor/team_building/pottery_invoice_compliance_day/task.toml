schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/pottery_invoice_compliance_day"
description = "A 25-stage indoor pottery team-building planning workflow covering vendor, invoice, budget, safety, privacy, and authorization controls."
authors = [{ name = "VibeLifeBench" }]

[metadata]
difficulty = "hard"
category = "team_building"
source_event_count = 46
harbor_step_count = 25
virtual_stage_count = 25
release_count = 21
stage_boundary_count = 25
mutation_event_count = 21
server_count = 7
source_task = "pottery_invoice_compliance_day"

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

