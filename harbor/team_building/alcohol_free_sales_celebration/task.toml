schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/alcohol-free-sales-celebration"
description = "A self-contained 25-step Harbor task for planning and reviewing an alcohol-free quarterly sales celebration with privacy, safety, vendor, budget, and authorization controls."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "team-event", "alcohol-free", "budget", "privacy", "safety", "authorization", "vendor-management"]

[metadata]
difficulty = "hard"
category = "event_operations"
tags = ["long-horizon", "multi-step", "team-event", "privacy", "safety", "budget", "authorization"]
source_task = "alcohol_free_sales_celebration"
source_event_count = 44
mutation_event_count = 19
virtual_stage_count = 25
harbor_step_count = 25
release_count = 19
stage_boundary_count = 25
server_count = 7
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Event operations"
occupation = "Team event coordinator"
onet_skills = ["monitoring", "planning", "information ordering", "judgment and decision making", "time management"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 8
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "csv", "notion-records", "calendar-events", "notification-drafts"]
deliverables = ["attendee roster", "vendor shortlist", "budget ledger", "risk register", "authorization log", "communication drafts", "calendar and reminders", "post-event review"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
