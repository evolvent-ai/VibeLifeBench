authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "team-building", "community-service", "volunteer-coordination", "donation-compliance", "privacy", "media-consent", "budget-control"]

[metadata]
difficulty = "hard"
category = "team_building"
