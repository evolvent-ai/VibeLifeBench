language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "corporate social responsibility and community services"
occupation = "community service event coordinator"
onet_skills = ["active listening", "coordination", "critical thinking", "information ordering", "monitoring", "judgment and decision making", "time management"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 15
multimodal = false
web_search_allowed = false

[metadata.output]
