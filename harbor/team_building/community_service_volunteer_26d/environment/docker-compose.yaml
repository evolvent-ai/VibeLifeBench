services:
  main:
    build: {context: ., dockerfile: Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      world-controller: {condition: service_healthy}
      banking: {condition: service_healthy}
      calendar: {condition: service_healthy}
      content-platform: {condition: service_healthy}
      ecommerce: {condition: service_healthy}
      car-rental: {condition: service_healthy}
      maps: {condition: service_healthy}
      delivery-logistics: {condition: service_healthy}
      email: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
      review-platform: {condition: service_healthy}
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: banking,calendar,content-platform,ecommerce,email,notification-hub,notion,review-platform,car-rental,maps,delivery-logistics,world-controller,localhost,127.0.0.1,::1
      no_proxy: banking,calendar,content-platform,ecommerce,email,notification-hub,notion,review-platform,car-rental,maps,delivery-logistics,world-controller,localhost,127.0.0.1,::1
  workspace-init:
    build: {context: ., dockerfile: workspace-init/Dockerfile}
    volumes: [workspace-state:/target]
    restart: "no"
  world-controller:
    build: {context: ., dockerfile: world-controller/Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      banking: {condition: service_healthy}
      calendar: {condition: service_healthy}
      content-platform: {condition: service_healthy}
      ecommerce: {condition: service_healthy}
      email: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
      review-platform: {condition: service_healthy}
      car-rental: {condition: service_healthy}
      maps: {condition: service_healthy}
      delivery-logistics: {condition: service_healthy}
    volumes:
      - banking-env:/banking-env
      - calendar-env:/calendar-env
      - content-platform-env:/content-platform-env
      - ecommerce-env:/ecommerce-env
      - email-env:/email-env
      - notification-hub-env:/notification-hub-env
      - notion-env:/notion-env
      - review-platform-env:/review-platform-env
      - car-rental-env:/car-rental-env
      - maps-env:/maps-env
      - delivery-logistics-env:/delivery-logistics-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      WORLD_CLOCK_REQUIRED: "1"
      CLOCK_TOKEN: community-service-volunteer-26d-clock-token
      HEALTH_TOKEN: community-service-volunteer-26d-health-token
    expose: ["8090"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  banking:
    build: {context: ./servers/banking_mock}
    volumes: [./seeds/banking:/env-seed:ro, banking-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: &mock-health {test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"], interval: 2s, timeout: 5s, retries: 30, start_period: 3s}
  calendar:
    build: {context: ./servers/calendar_mock}
    volumes: [./seeds/calendar:/env-seed:ro, calendar-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
  content-platform:
    build: {context: ./servers/content_platform_mock}
    volumes: [./seeds/content_platform:/env-seed:ro, content-platform-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
  ecommerce:
    build: {context: ./servers/ecommerce_mock}
    volumes: [./seeds/ecommerce:/env-seed:ro, ecommerce-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
  email:
    build: {context: ./servers/email_mock}
    volumes: [./seeds/email:/env-seed:ro, email-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
  notification-hub:
    build: {context: ./servers/notification_hub_mock}
    volumes: [./seeds/notification_hub:/env-seed:ro, notification-hub-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
  notion:
    build: {context: ./servers/notion_mock}
    volumes: [./seeds/notion:/env-seed:ro, notion-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
  review-platform:
    build: {context: ./servers/review_platform_mock}
    volumes: [./seeds/review_platform:/env-seed:ro, review-platform-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
  car-rental:
    build: {context: ./servers/car_rental_mock}
    volumes: [./seeds/car_rental:/env-seed:ro, car-rental-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
  maps:
    build: {context: ./servers/maps_mock}
    volumes: [./seeds/maps:/env-seed:ro, maps-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
  delivery-logistics:
    build: {context: ./servers/delivery_logistics_mock}
    volumes: [./seeds/delivery_logistics:/env-seed:ro, delivery-logistics-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *mock-health
volumes:
  workspace-state: {}
  controller-state: {}
  eval-evidence: {}
  world-clock: {}
  banking-env: {}
  calendar-env: {}
  content-platform-env: {}
  ecommerce-env: {}
  email-env: {}
  notification-hub-env: {}
  notion-env: {}
  review-platform-env: {}
  car-rental-env: {}
  maps-env: {}
  delivery-logistics-env: {}
