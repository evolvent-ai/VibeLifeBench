schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "team-building/family-office-open-day"
description = "A 25-step family open-day coordination task covering office safety, child safeguarding, vendor verification, privacy, budgeting, authorization, on-site operations, and post-event review."
authors = [{ name = "synthetic_team_building_writer" }]
keywords = ["multi-step", "family-open-day", "event-planning", "child-safety", "vendor-risk", "privacy", "budget", "authorization"]

[metadata]
difficulty = "hard"
category = "team-building"
tags = ["long-horizon", "multi-step", "event-planning", "vendor-risk", "child-safety", "photo-consent", "privacy", "budget", "authorization", "on-site-coordination", "post-event-review"]
source_task = "family_office_open_day"
source_event_count = 31
virtual_stage_count = 25
harbor_step_count = 25
release_count = 6
stage_boundary_count = 25
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Business Administration and Event Services"
occupation = "Administrative Services and Event Coordination"
onet_skills = ["Active Listening", "Critical Thinking", "Monitoring", "Information Ordering", "Time Management", "Judgment and Decision Making"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 15
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 7
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email-drafts", "ecommerce-cart"]
deliverables = ["family open-day master plan", "budget ledger", "risk register", "vendor shortlist", "authorization log", "communication drafts", "post-event review"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

