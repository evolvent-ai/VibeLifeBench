schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "local/customer-success-recovery-lunch"
description = "A 25-step Harbor task for planning, safeguarding, executing, and reviewing a low-pressure customer-success team lunch with vendor, budget, privacy, dietary, staffing, and authorization constraints."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "team-building", "customer-success", "vendor-risk", "budget", "privacy", "dietary-safety", "authorization"]

[metadata]
difficulty = "hard"
category = "team_building"
tags = ["long-horizon", "multi-step", "event-planning", "vendor-risk", "budget", "privacy", "safety", "authorization", "onsite-coordination", "post-event-review"]
source_task = "customer_success_recovery_lunch"
virtual_stage_count = 25
harbor_step_count = 25
source_event_count = 31
release_count = 6
stage_boundary_count = 25
server_count = 7
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "customer success operations"
occupation = "customer success program coordinator"
onet_skills = ["planning", "monitoring", "judgment and decision making", "time management", "information ordering"]

[metadata.estimates]
task_completion_hours = 8.0
task_creation_hours = 32.0

[metadata.resources]
input_file_count = 0
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email", "vendor-shortlist", "budget-ledger", "anonymous-feedback", "sop"]
deliverables = ["event plan", "budget and invoice ledger", "vendor verification record", "candidate calendar", "privacy and safety plan", "staffing coverage plan", "anonymous feedback summary", "post-event SOP"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

