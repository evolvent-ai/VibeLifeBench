schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/central-ac-install-30d"
description = "A self-contained 25-step Harbor task for central air-conditioner installation, refunds, payment disputes, and evidence tracking."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "central-air-conditioner", "installation", "refunds", "payment-disputes", "evidence"]

[metadata]
difficulty = "hard"
category = "consumer-service-and-finance"
tags = ["long-horizon", "installation", "after-sales", "refunds", "privacy", "deadlines"]
source_task = "central_ac_install_30d"
virtual_stage_count = 24
harbor_step_count = 25
source_event_count = 39
mutation_event_count = 14
release_count = 14
stage_boundary_count = 24
server_count = 7
web_search = "disabled"

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
name = "calendar"
transport = "streamable-http"
url = "http://calendar:8000/mcp"

[[environment.mcp_servers]]
name = "credit_card"
transport = "streamable-http"
url = "http://credit-card:8000/mcp"

[[environment.mcp_servers]]
