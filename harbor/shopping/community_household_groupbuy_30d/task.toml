schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "local/community-household-groupbuy-30d"
description = "A 25-step Harbor task for verifying, fulfilling, reconciling, and safely closing a household essentials group purchase for a residential community."
authors = [{ name = "xhs_benchmark" }]
keywords = ["multi-step", "community-group-purchase", "product-verification", "fulfillment", "pickup", "privacy", "settlement", "consumer-safety"]

[metadata]
difficulty = "hard"
category = "shopping"
tags = ["shopping", "group-purchase", "tiered-pricing", "pickup-verification", "privacy", "settlement", "weather", "long-horizon"]
source_task = "community_household_groupbuy_30d"
source_event_count = 35
mutation_event_count = 10
virtual_stage_count = 24
harbor_step_count = 25
release_count = 10
stage_boundary_count = 24
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "retail and community commerce"
occupation = "community group-purchase coordinator"
onet_skills = ["active listening", "coordination", "monitoring", "record keeping", "judgment and decision making", "time management"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 7
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 7
deliverable_formats = ["markdown", "csv", "calendar-events", "email", "notifications"]
deliverables = ["product verification ledger", "fulfillment and pickup ledger", "participant and settlement ledger", "substitution confirmation template", "pickup plan", "final reconciliation", "reusable launch checklist"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
