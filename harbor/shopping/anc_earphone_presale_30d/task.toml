schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "shopping/anc-earphone-presale-30d"
description = "Self-contained 32-step Harbor task for a 24-stage ANC earphone presale, price-protection, card-dispute, and payout-reconciliation workflow."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "shopping", "presale", "price-protection", "card-dispute", "evidence", "reconciliation", "authorization"]

[metadata]
difficulty = "hard"
category = "shopping"
tags = ["long-horizon", "presale", "deposit-balance", "price-protection", "weather", "phishing", "marketplace-payout"]
source_task = "anc_earphone_presale_30d"
virtual_stage_count = 24
harbor_step_count = 32
source_scoring = "flat-pool"
source_event_count = 47
mutation_event_count = 15
stage_boundary_count = 24
server_count = 8

[metadata.taxonomy]
sector = "ecommerce and consumer finance"
occupation = "consumer purchase and dispute coordinator"

[metadata.estimates]
task_completion_hours = 16.0
task_creation_hours = 10.0

[metadata.resources]
input_file_count = 0
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 6
deliverable_formats = ["markdown", "structured records"]
deliverables = ["case tracker", "evidence ledger", "budget plan", "decision log", "funds reconciliation", "final archive"]

