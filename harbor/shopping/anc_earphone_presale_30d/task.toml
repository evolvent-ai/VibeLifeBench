artifacts = [{ source = "/evidence/steps/event-030", destination = "evidence", service = "world-controller" }, { source = "/evidence/stages/stage-22", destination = "evidence-stage-22", service = "world-controller" }]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-030"
VIRTUAL_STAGE = "22"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "S22_consistency"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-030 22 S22_consistency 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-030"

