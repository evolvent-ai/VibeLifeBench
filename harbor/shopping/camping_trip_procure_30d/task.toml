schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/camping-trip-procure-30d"
description = "A self-contained 25-step Harbor task for planning and reconciling a five-person camping gear purchase, delivery, resale, safety, and budget workflow over 30 days."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "camping", "shopping", "delivery", "budget", "weather", "safety", "authorization"]

[metadata]
difficulty = "hard"
category = "shopping"
tags = ["long-horizon", "multi-step", "camping", "budget-cap", "coupon-optimization", "weather", "delivery", "resale", "authorization"]
source_task = "camping_trip_procure_30d"
source_event_count = 35
mutation_event_count = 10
virtual_stage_count = 24
harbor_step_count = 25
release_count = 10
stage_boundary_count = 24
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Retail and trip operations"
occupation = "Camping procurement coordinator"
onet_skills = ["monitoring", "planning", "information ordering", "judgment and decision making", "time management"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 6
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown"]
deliverables = ["gear plan", "budget ledger", "decision log", "risk register", "order tracker", "evidence log", "final summary", "operational heartbeat"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
