schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "renovation/bathroom-reno-30d"
description = "A self-contained 24-step Harbor task for supervising a small bathroom renovation, reconciling quality evidence and finances, and preserving older-adult safety and authorization boundaries."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "renovation", "bathroom", "quality-control", "refunds", "older-adult-safety", "authorization"]

[metadata]
difficulty = "hard"
category = "renovation"
tags = ["long-horizon", "renovation-supervision", "staged-acceptance", "rework", "warranty-retention", "weather", "fraud-prevention", "authorization"]
source_task = "bathroom_reno_30d"
source_event_count = 36
mutation_event_count = 12
virtual_stage_count = 24
harbor_step_count = 24
release_count = 12
stage_boundary_count = 24
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Residential Construction"
occupation = "Construction and Building Inspector"
onet_skills = ["Critical Thinking", "Quality Control Analysis", "Monitoring", "Information Ordering", "Judgment and Decision Making"]

[metadata.estimates]
task_completion_hours = 10.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 5
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "calendar-events", "email-records"]
deliverables = ["renovation plan", "budget ledger", "decision log", "risk register", "order tracker", "evidence log", "final summary", "continuity log"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

