multi_step_reward_strategy = "final"

[task]
name = "renovation/apartment-renovation-20d"
description = "Self-contained 29-step Harbor task for coordinating a 20-day apartment renovation under budget, schedule, safety, property-management, and acceptance constraints."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "renovation", "budget", "compliance", "vendor-management", "schedule", "inspection-gates"]

[metadata]
difficulty = "hard"
category = "renovation"
tags = ["long-horizon", "multi-day", "proactive", "budget", "compliance", "vendor-management", "schedule", "inspection-gates"]
source_task = "apartment_renovation_20d"
virtual_stage_count = 22
harbor_step_count = 29
source_scoring = "flat-pool"
