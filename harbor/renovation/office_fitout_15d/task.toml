min_reward = { verifier_ok = 1.0 }
artifacts = [{ source = "/evidence/steps/event-061", service = "world-controller", destination = "evidence" }]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-061"
VIRTUAL_STAGE = "13"
RUN_STAGE_RUBRIC = "0"
STAGE_BOUNDARY = "0"
SOURCE_EVENT_ID = "D13_dual_recheck_results"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-061 13 D13_dual_recheck_results 0"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-061"

