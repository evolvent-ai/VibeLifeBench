services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      calendar:
        condition: service_healthy
      email:
        condition: service_healthy
      hotel-booking:
        condition: service_healthy
      maps:
        condition: service_healthy
      notion:
        condition: service_healthy
      visa-and-advisory:
        condition: service_healthy
      weather:
        condition: service_healthy
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,::1,calendar,email,hotel-booking,hotel_booking,localhost,maps,notion,visa-and-advisory,visa_and_advisory,weather,workspace-init,workspace_init,world-controller,world_controller
      no_proxy: 127.0.0.1,::1,calendar,email,hotel-booking,hotel_booking,localhost,maps,notion,visa-and-advisory,visa_and_advisory,weather,workspace-init,workspace_init,world-controller,world_controller
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
      - workspace-state:/target
    restart: "no"

  calendar:
    build: {context: ./servers/calendar_mock}
    volumes:
      - ./seeds/calendar:/env-seed:ro
      - calendar-env:/env
      - world-clock:/world-clock:ro
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: [8000]
    healthcheck: &mock-health
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
  email:
    build: {context: ./servers/email_mock}
    volumes:
      - ./seeds/email:/env-seed:ro
      - email-env:/env
      - world-clock:/world-clock:ro
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: [8000]
    healthcheck: *mock-health
  hotel-booking:
    build: {context: ./servers/hotel_booking_mock_task}
    volumes:
      - ./seeds/hotel_booking:/env-seed:ro
      - hotel-booking-env:/env
      - world-clock:/world-clock:ro
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: [8000]
    healthcheck: *mock-health
  maps:
    build: {context: ./servers/maps_mock}
    volumes:
      - ./seeds/maps:/env-seed:ro
      - maps-env:/env
      - world-clock:/world-clock:ro
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: [8000]
    healthcheck: *mock-health
  notion:
    build: {context: ./servers/notion_mock}
    volumes:
      - ./seeds/notion:/env-seed:ro
      - notion-env:/env
      - world-clock:/world-clock:ro
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: [8000]
    healthcheck: *mock-health
  visa-and-advisory:
    build: {context: ./servers/visa_and_advisory_mock}
    volumes:
      - ./seeds/visa_and_advisory:/env-seed:ro
      - visa-and-advisory-env:/env
      - world-clock:/world-clock:ro
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: [8000]
    healthcheck: *mock-health
  weather:
    build: {context: ./servers/weather_mock}
    volumes:
      - ./seeds/weather:/env-seed:ro
      - weather-env:/env
      - world-clock:/world-clock:ro
      - workspace-state:/workspace:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      AGENT_WORKSPACE: /workspace
    expose: [8000]
    healthcheck: *mock-health

  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      calendar:
        condition: service_healthy
      email:
        condition: service_healthy
      hotel-booking:
        condition: service_healthy
      maps:
        condition: service_healthy
      notion:
        condition: service_healthy
      visa-and-advisory:
        condition: service_healthy
      weather:
        condition: service_healthy
    environment:
      HEALTH_TOKEN: office-fitout-15d-health-20260824
      CLOCK_TOKEN: office-fitout-15d-clock-20260824
      SCENARIO_CLOCK_REQUIRED: "1"
      SCENARIO_CLOCK_PATH: /world-clock/current.json
      WORLD_CLOCK_FILE: /world-clock/current.json
    volumes:
      - calendar-env:/calendar-env
      - email-env:/email-env
      - hotel-booking-env:/hotel-booking-env
      - maps-env:/maps-env
      - notion-env:/notion-env
      - visa-and-advisory-env:/visa-and-advisory-env
      - weather-env:/weather-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: [8090]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

volumes:
  workspace-state:
  eval-evidence:
  world-clock:
  controller-state:
  calendar-env:
  email-env:
  hotel-booking-env:
  maps-env:
  notion-env:
  visa-and-advisory-env:
  weather-env:
