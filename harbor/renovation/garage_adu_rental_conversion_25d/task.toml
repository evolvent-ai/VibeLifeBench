VIRTUAL_STAGE = "24"
SOURCE_EVENT_ID = "A24_closeout"
STAGE_BOUNDARY = "1"
RUN_STAGE_RUBRIC = "1"
INCLUDE_ALL_BUCKETS = "1"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-028 24 A24_closeout 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-028"

