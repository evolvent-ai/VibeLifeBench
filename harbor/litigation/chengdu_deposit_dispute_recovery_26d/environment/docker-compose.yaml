services:
  main:
    build: {context: ., dockerfile: Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      world-controller: {condition: service_healthy}
      banking: {condition: service_healthy}
      email: {condition: service_healthy}
      calendar: {condition: service_healthy}
      legal-search: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
    volumes: [workspace-state:/workspace, eval-evidence:/harbor/evidence:ro, world-clock:/world-clock:ro]
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: localhost,127.0.0.1,::1,world-controller,banking,email,calendar,legal-search,notion,notification-hub
      no_proxy: localhost,127.0.0.1,::1,world-controller,banking,email,calendar,legal-search,notion,notification-hub
  workspace-init:
    build: {context: ., dockerfile: workspace-init/Dockerfile}
    volumes: [workspace-state:/target]
    restart: 'no'
  banking: {build: {context: ./servers/banking_mock}, volumes: [./seeds/banking:/env-seed:ro, banking-env:/env, world-clock:/world-clock:ro], expose: ['8000'], environment: {WORLD_CLOCK_FILE: /world-clock/current.json}, healthcheck: &health {test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"], interval: 2s, timeout: 5s, retries: 30, start_period: 3s}}
  email: {build: {context: ./servers/email_mock}, volumes: [./seeds/email:/env-seed:ro, email-env:/env, world-clock:/world-clock:ro], expose: ['8000'], environment: {WORLD_CLOCK_FILE: /world-clock/current.json}, healthcheck: *health}
  calendar: {build: {context: ./servers/calendar_mock}, volumes: [./seeds/calendar:/env-seed:ro, calendar-env:/env, world-clock:/world-clock:ro], expose: ['8000'], environment: {WORLD_CLOCK_FILE: /world-clock/current.json}, healthcheck: *health}
  legal-search: {build: {context: ./servers/legal_search_mock}, volumes: [./seeds/legal_search:/env-seed:ro, legal-search-env:/env, world-clock:/world-clock:ro], expose: ['8000'], environment: {WORLD_CLOCK_FILE: /world-clock/current.json}, healthcheck: *health}
  notion: {build: {context: ./servers/notion_mock}, volumes: [./seeds/notion:/env-seed:ro, notion-env:/env, world-clock:/world-clock:ro], expose: ['8000'], environment: {WORLD_CLOCK_FILE: /world-clock/current.json}, healthcheck: *health}
  notification-hub: {build: {context: ./servers/notification_hub_mock}, volumes: [./seeds/notification_hub:/env-seed:ro, notification-hub-env:/env, world-clock:/world-clock:ro], expose: ['8000'], environment: {WORLD_CLOCK_FILE: /world-clock/current.json}, healthcheck: *health}
  world-controller:
    build: {context: ., dockerfile: world-controller/Dockerfile}
    environment: {HEALTH_TOKEN: chengdu-health-7f9a31c2, WORLD_CLOCK_FILE: /world-clock/current.json, WORLD_CLOCK_REQUIRED: '1', CLOCK_TOKEN: chengdu_deposit_dispute_recovery_26d-clock-token}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      banking: {condition: service_healthy}
      email: {condition: service_healthy}
      calendar: {condition: service_healthy}
      legal-search: {condition: service_healthy}
      notion: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
    volumes: [banking-env:/banking-env, email-env:/email-env, calendar-env:/calendar-env, legal-search-env:/legal-search-env, notion-env:/notion-env, notification-hub-env:/notification-hub-env, controller-state:/controller-state, workspace-state:/workspace-source:ro, eval-evidence:/evidence, world-clock:/world-clock]
    expose: ['8090']
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"], interval: 2s, timeout: 5s, retries: 30, start_period: 3s}
volumes:
  workspace-state: {}
  banking-env: {}
  email-env: {}
  calendar-env: {}
  legal-search-env: {}
  notion-env: {}
  notification-hub-env: {}
  controller-state: {}
  eval-evidence: {}
  world-clock: {}
