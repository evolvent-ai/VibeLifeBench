schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "rental/chengdu-deposit-dispute-recovery-26d"
description = "A self-contained 32-step, 22-stage workflow for investigating, documenting, disputing, and resolving a residential security-deposit claim in Chengdu while preserving tenant authorization boundaries."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "rental", "security-deposit", "evidence", "legal-research", "dispute-filing", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "rental"
tags = ["long-horizon", "residential-lease", "deposit-recovery", "evidence-reconciliation", "deadline-management", "authorization"]
source_task = "chengdu_deposit_dispute_recovery_26d"
source_event_count = 48
virtual_stage_count = 22
harbor_step_count = 32
mutation_event_count = 16
release_count = 12
stage_boundary_count = 22
server_count = 6
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Real Estate and Legal Services"
occupation = "Residential Tenancy Dispute Support"
skills = ["Evidence Management", "Legal Research", "Financial Reconciliation", "Dispute Preparation", "Risk Assessment"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.output]
deliverable_count = 5
deliverable_formats = ["markdown", "notion-records", "dispute-record"]
deliverables = ["evidence log", "deduction analysis", "risk register", "decision log", "final summary"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
