[steps.verifier.env]
HARBOR_STEP_NAME = "event-029"
VIRTUAL_STAGE = "20"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "s20_user"

