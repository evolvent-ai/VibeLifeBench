services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      email:
        condition: service_healthy
      calendar:
        condition: service_healthy
      legal-search:
        condition: service_healthy
      notion:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,::1,calendar,email,legal-search,legal_search,localhost,notification-hub,notification_hub,notion,workspace-init,workspace_init,world-controller,world_controller
      no_proxy: 127.0.0.1,::1,calendar,email,legal-search,legal_search,localhost,notification-hub,notification_hub,notion,workspace-init,workspace_init,world-controller,world_controller

  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
      - ./workspace:/seed:ro
      - workspace-state:/target
    restart: "no"

  email:
    build:
      context: ./servers/email_mock
    volumes:
      - ./seeds/email:/env-seed:ro
      - email-env:/env
      - world-clock:/world-clock:ro
      - ./sqlite_delete_sitecustomize.py:/usr/local/lib/python3.12/site-packages/sitecustomize.py:ro
    expose: ["8000"]
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
    healthcheck: &mock-health
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  calendar:
    build:
      context: ./servers/calendar_mock
    volumes:
      - ./seeds/calendar:/env-seed:ro
      - calendar-env:/env
      - world-clock:/world-clock:ro
      - ./sqlite_delete_sitecustomize.py:/usr/local/lib/python3.12/site-packages/sitecustomize.py:ro
    expose: ["8000"]
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
    healthcheck: *mock-health

  legal-search:
    build:
      context: ./servers/legal_search_mock
    volumes:
      - ./seeds/legal_search:/env-seed:ro
      - legal-search-env:/env
      - world-clock:/world-clock:ro
      - ./sqlite_delete_sitecustomize.py:/usr/local/lib/python3.12/site-packages/sitecustomize.py:ro
    expose: ["8000"]
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
    healthcheck: *mock-health

  notion:
    build:
      context: ./servers/notion_mock
    volumes:
      - ./seeds/notion:/env-seed:ro
      - notion-env:/env
      - world-clock:/world-clock:ro
      - ./sqlite_delete_sitecustomize.py:/usr/local/lib/python3.12/site-packages/sitecustomize.py:ro
    expose: ["8000"]
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
    healthcheck: *mock-health

  notification-hub:
    build:
      context: ./servers/notification_hub_mock
    volumes:
      - ./seeds/notification_hub:/env-seed:ro
      - notification-hub-env:/env
      - world-clock:/world-clock:ro
      - ./sqlite_delete_sitecustomize.py:/usr/local/lib/python3.12/site-packages/sitecustomize.py:ro
    expose: ["8000"]
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
    healthcheck: *mock-health

  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      email:
        condition: service_healthy
      calendar:
        condition: service_healthy
      legal-search:
        condition: service_healthy
      notion:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
    environment:
      HEALTH_TOKEN: food-safety-health-33d
      WORLD_CLOCK_FILE: /world-clock/current.json
      SCENARIO_CLOCK_REQUIRED: "1"
      CLOCK_TOKEN: food-safety-clock-33d
    volumes:
      - email-env:/email-env
      - calendar-env:/calendar-env
      - legal-search-env:/legal-search-env
      - notion-env:/notion-env
      - notification-hub-env:/notification-hub-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

volumes:
  workspace-state:
  email-env:
  calendar-env:
  legal-search-env:
  notion-env:
  notification-hub-env:
  controller-state:
  eval-evidence:
  world-clock:
