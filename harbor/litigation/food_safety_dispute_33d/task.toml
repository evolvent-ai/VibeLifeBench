schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/food-safety-dispute-33d"
description = "Self-contained 30-step Harbor task for a food-safety online-shopping litigation workflow."
authors = [{ name = "VibeLifeBench" }]
keywords = ["multi-step", "litigation", "food-safety", "consumer-protection", "punitive-damages", "appeal"]

[metadata]
difficulty = "hard"
category = "litigation"
tags = ["long-horizon", "food-safety", "consumer-protection", "punitive-damages", "inspection", "appeal"]
source_task = "food_safety_dispute_33d"
virtual_stage_count = 22
harbor_step_count = 30
source_event_count = 41
release_count = 11
stage_boundary_count = 22
source_scoring = "flat-pool"

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
name = "calendar"
transport = "streamable-http"
url = "http://calendar:8000/mcp"

[[environment.mcp_servers]]
