HARBOR_STEP_NAME = "event-029"
VIRTUAL_STAGE = "21"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "s21_retro"
INCLUDE_ALL_BUCKETS = "1"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-029 21 s21_retro 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-029"
