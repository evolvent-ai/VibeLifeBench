schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "litigation/house-lease-dispute-30d"
description = "A self-contained 28-step, 22-stage workflow for evidence-based preparation, litigation tracking, and post-judgment planning in a Shanghai residential lease dispute."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "litigation", "residential-lease", "evidence", "jurisdiction", "judicial-appraisal", "appeal"]

[metadata]
difficulty = "hard"
category = "litigation"
tags = ["long-horizon", "house-lease", "tenancy", "right-of-first-refusal", "evidence", "authorization", "disruption-handling"]
source_task = "house_lease_dispute_30d"
source_event_count = 42
virtual_stage_count = 22
harbor_step_count = 28
mutation_event_count = 14
release_count = 14
stage_boundary_count = 22
server_count = 5
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Legal Services"
occupation = "Civil Litigation Case Support"
skills = ["Legal Research", "Evidence Management", "Case Planning", "Deadline Management", "Risk Assessment"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.output]
deliverable_count = 6
deliverable_formats = ["markdown", "notion-records", "calendar-events"]
deliverables = ["case page", "procedure timeline", "claim analysis", "evidence ledger", "appraiser comparison", "case archive"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
