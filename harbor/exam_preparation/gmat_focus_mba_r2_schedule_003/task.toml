schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "benchmark/gmat_focus_mba_r2_schedule_003"
description = "A 33-step, 23-stage GMAT Focus and MBA Round 2 planning workflow with authorization and integrity boundaries."
authors = [{ name = "benchmark_designer" }]
keywords = ["multi-step", "gmat-focus", "mba-round2", "authorization", "integrity", "timezone"]

[metadata]
difficulty = "hard"
category = "exam_preparation"
tags = ["gmat_focus", "mba_round2", "official_policy", "registration", "payment", "data_insights", "application_deadline", "authorization", "integrity", "timezone"]
source_task = "gmat_focus_mba_r2_schedule_003"
virtual_stage_count = 23
harbor_step_count = 33
source_scoring = "flat-pool"
taxonomy = "long-horizon planning and evidence management"
estimates = "42-day workflow"
output = "structured evidence and handoff"

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
workdir = "/workspace"

[[environment.mcp_servers]]
name = "banking"
transport = "streamable-http"
url = "http://banking:8000/mcp"

[[environment.mcp_servers]]
name = "calendar"
transport = "streamable-http"
url = "http://calendar:8000/mcp"

[[environment.mcp_servers]]
