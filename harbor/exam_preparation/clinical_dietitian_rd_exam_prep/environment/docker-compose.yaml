services:
  main:
    build: {context: ., dockerfile: Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      world-controller: {condition: service_healthy}
      calendar: {condition: service_healthy}
      email: {condition: service_healthy}
      health-tracker: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
      - agent-logs:/logs/agent
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: &no-proxy localhost,127.0.0.1,::1,.svc,.svc.cluster.local,kubernetes.default.svc,calendar,email,health-tracker,notification-hub,notion,world-controller
      no_proxy: *no-proxy
  workspace-init:
    build: {context: ., dockerfile: workspace-init/Dockerfile}
    volumes:
      - workspace-state:/target
      - ./workspace:/seed:ro
    restart: "no"
  calendar:
    build: {context: ./servers/calendar_mock}
    volumes: [./seeds/calendar:/env-seed:ro, calendar-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: &health {test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"], interval: 2s, timeout: 5s, retries: 30, start_period: 3s}
  email:
    build: {context: ./servers/email_mock}
    volumes: [./seeds/email:/env-seed:ro, email-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *health
  health-tracker:
    build: {context: ./servers/health_tracker_mock}
    volumes: [./seeds/health_tracker:/env-seed:ro, health-tracker-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *health
  notification-hub:
    build: {context: ./servers/notification_hub_mock}
    volumes: [./seeds/notification_hub:/env-seed:ro, notification-hub-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *health
  notion:
    build: {context: ./servers/notion_mock}
    volumes: [./seeds/notion:/env-seed:ro, notion-env:/env, world-clock:/world-clock:ro]
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}
    expose: ["8000"]
    healthcheck: *health
  world-controller:
    build: {context: ., dockerfile: world-controller/Dockerfile}
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      CLOCK_TOKEN: clinical-dietitian-rd-exam-prep-clock-token
      RELEASE_TOKEN: clinical-dietitian-rd-exam-prep-release-token
      HEALTH_TOKEN: clinical-dietitian-rd-exam-prep-health-token
      SCENARIO_CLOCK_REQUIRED: "1"
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      calendar: {condition: service_healthy}
      email: {condition: service_healthy}
      health-tracker: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
    volumes:
      - calendar-env:/calendar-env
      - email-env:/email-env
      - health-tracker-env:/health-tracker-env
      - notification-hub-env:/notification-hub-env
      - notion-env:/notion-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: ["8090"]
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2).read()"], interval: 2s, timeout: 5s, retries: 30, start_period: 3s}
volumes:
  workspace-state: {}
  calendar-env: {}
  email-env: {}
  health-tracker-env: {}
  notification-hub-env: {}
  notion-env: {}
  controller-state: {}
  eval-evidence: {}
  world-clock: {}
  agent-logs: {}
