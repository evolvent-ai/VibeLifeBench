min_reward = { verifier_ok = 1.0 }
artifacts = [{ source = "/evidence/steps/event-029", service = "world-controller", destination = "evidence" }, { source = "/evidence/stages/stage-27", service = "world-controller", destination = "evidence-stage-27" }]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-029"
VIRTUAL_STAGE = "27"
STAGE_BOUNDARY = "1"
RUN_STAGE_RUBRIC = "1"
SOURCE_EVENT_ID = "S27_event"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-029 27 S27_event 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-029"

