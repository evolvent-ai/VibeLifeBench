schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/pharmacist-western-registration-shift-prep"
description = "A self-contained 32-step Harbor task for licensed pharmacist Western medicine registration, legitimate course purchasing, and shift-aware exam preparation."
authors = [{ name = "VibeLifeBench" }]
keywords = ["multi-step", "licensed-pharmacist", "western-medicine", "registration", "course-purchase", "shift-schedule", "integrity", "authorization"]

[metadata]
difficulty = "hard"
category = "exam-preparation"
tags = ["long-horizon", "multi-step", "licensed-pharmacist", "western-medicine", "registration", "privacy", "authorization"]
source_task = "pharmacist_western_registration_shift_prep"
virtual_stage_count = 30
harbor_step_count = 32
source_event_count = 53
mutation_event_count = 21
release_count = 21
stage_boundary_count = 26
server_count = 5
source_scoring = "flat-pool"
web_search = "disabled"

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
name = "calendar"
transport = "streamable-http"
url = "http://calendar:8000/mcp"

[[environment.mcp_servers]]
name = "ecommerce"
transport = "streamable-http"
url = "http://ecommerce:8000/mcp"

[[environment.mcp_servers]]
name = "email"
transport = "streamable-http"
url = "http://email:8000/mcp"

[[environment.mcp_servers]]
name = "notification_hub"
transport = "streamable-http"
url = "http://notification-hub:8000/mcp"

[[environment.mcp_servers]]
name = "notion"
transport = "streamable-http"
url = "http://notion:8000/mcp"

