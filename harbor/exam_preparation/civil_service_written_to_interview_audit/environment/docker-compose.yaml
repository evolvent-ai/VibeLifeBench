services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      calendar:
        condition: service_healthy
      content-platform:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
      email:
        condition: service_healthy
      legal-search:
        condition: service_healthy
      maps:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
      review-platform:
        condition: service_healthy
    volumes:
    - workspace-state:/workspace
    - eval-evidence:/harbor/evidence:ro
    - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: calendar,content-platform,ecommerce,email,legal-search,maps,notification-hub,notion,review-platform,world-controller,localhost,127.0.0.1,::1
      no_proxy: calendar,content-platform,ecommerce,email,legal-search,maps,notification-hub,notion,review-platform,world-controller,localhost,127.0.0.1,::1
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
    - workspace-state:/target
    restart: 'no'
  calendar:
    build:
      context: ./servers/calendar_mock
    volumes:
    - ./seeds/calendar:/env-seed:ro
    - calendar-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  content-platform:
    build:
      context: ./servers/content_platform_mock
    volumes:
    - ./seeds/content_platform:/env-seed:ro
    - content-platform-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
