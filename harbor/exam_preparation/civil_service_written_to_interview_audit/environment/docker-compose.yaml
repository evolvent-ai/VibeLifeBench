  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    environment:
      HEALTH_TOKEN: civil-service-health-token
      WORLD_CLOCK_FILE: /world-clock/current.json
      WORLD_CLOCK_REQUIRED: '1'
      CLOCK_TOKEN: civil-service-clock-token
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      calendar:
        condition: service_healthy
      content-platform:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
      email:
        condition: service_healthy
      legal-search:
        condition: service_healthy
      maps:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
      review-platform:
        condition: service_healthy
    volumes:
    - calendar-env:/calendar-env
    - content-platform-env:/content-platform-env
    - ecommerce-env:/ecommerce-env
    - email-env:/email-env
    - legal-search-env:/legal-search-env
    - maps-env:/maps-env
    - notification-hub-env:/notification-hub-env
    - notion-env:/notion-env
    - review-platform-env:/review-platform-env
    - controller-state:/controller-state
    - workspace-state:/workspace-source:ro
    - eval-evidence:/evidence
    - world-clock:/world-clock
    expose:
    - '8090'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
volumes:
  workspace-state: null
  eval-evidence: null
  world-clock: null
  controller-state: null
  calendar-env: null
  content-platform-env: null
  ecommerce-env: null
  email-env: null
  legal-search-env: null
  maps-env: null
  notification-hub-env: null
  notion-env: null
  review-platform-env: null
