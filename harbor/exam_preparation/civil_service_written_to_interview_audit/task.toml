schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/civil-service-written-to-interview-audit"
description = "A self-contained 25-step Harbor task for civil-service written-exam tracking, position eligibility, interview confirmation, and qualification review."
authors = [{ name = "VibeLifeBench" }]
keywords = ["multi-step", "civil-service", "exam", "qualification", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "exam-preparation"
tags = ["long-horizon", "civil-service", "qualification-audit", "official-policy", "interview-review", "privacy", "integrity", "authorization"]
source_task = "civil_service_written_to_interview_audit"
virtual_stage_count = 25
harbor_step_count = 25
source_event_count = 36
mutation_event_count = 11
release_count = 11
stage_boundary_count = 25
server_count = 9
source_scoring = "flat-pool"
web_search = "disabled"

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
name = "calendar"
transport = "streamable-http"
url = "http://calendar:8000/mcp"

[[environment.mcp_servers]]
name = "content_platform"
transport = "streamable-http"
url = "http://content-platform:8000/mcp"

