schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "exam-preparation/bank-teller-dual-subject-cert-prep"
description = "A self-contained 29-step Harbor task for a bank teller preparing for a two-subject junior banking qualification examination with registration, scheduling, study tracking, integrity controls, and result archiving."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "exam-preparation", "banking", "registration", "study-plan", "integrity", "authorization", "long-horizon"]

[metadata]
difficulty = "hard"
category = "exam_preparation"
tags = ["banking-qualification", "registration", "exam-seat", "study-plan", "wrong-answer-ledger", "integrity", "authorization", "long-horizon"]
source_task = "bank_teller_dual_subject_cert_prep"
source_event_count = 43
mutation_event_count = 14
virtual_stage_count = 25
harbor_step_count = 29
release_count = 11
stage_boundary_count = 25
server_count = 6
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Banking and Financial Services"
occupation = "Bank Teller"
onet_skills = ["Critical Thinking", "Information Ordering", "Monitoring", "Time Management", "Judgment and Decision Making"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 6
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 7
deliverable_formats = ["markdown", "calendar-records", "email-records"]
deliverables = ["registration ledger", "subject comparison matrix", "exam-seat and payment log", "study plan", "wrong-answer ledger", "integrity and authorization log", "final result archive"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

