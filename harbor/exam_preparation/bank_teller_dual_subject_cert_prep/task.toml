min_reward = { verifier_ok = 1.0 }
artifacts = [{ source = "/evidence/steps/event-027", destination = "evidence", service = "world-controller" }, { source = "/evidence/stages/stage-23", destination = "evidence-stage-23", service = "world-controller" }]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-027"
VIRTUAL_STAGE = "23"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "evt_028_score_query"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-027 23 evt_028_score_query 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-027"

[[steps]]
name = "event-028"
min_reward = { verifier_ok = 1.0 }
artifacts = [{ source = "/evidence/steps/event-028", destination = "evidence", service = "world-controller" }, { source = "/evidence/stages/stage-24", destination = "evidence-stage-24", service = "world-controller" }]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-028"
VIRTUAL_STAGE = "24"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "evt_029_final_archive"
INCLUDE_ALL_BUCKETS = "1"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-028 24 evt_029_final_archive 1"
