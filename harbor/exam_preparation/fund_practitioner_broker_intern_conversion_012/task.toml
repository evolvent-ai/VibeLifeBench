[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-030 23 evt_023_exam_done 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-030"

[[steps]]
