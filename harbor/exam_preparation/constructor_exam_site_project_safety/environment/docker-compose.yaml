services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      calendar:
        condition: service_healthy
      content-platform:
        condition: service_healthy
      delivery-logistics:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
      email:
        condition: service_healthy
      hotel-booking:
        condition: service_healthy
      maps:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
      rail-booking:
        condition: service_healthy
      weather:
        condition: service_healthy
    volumes:
    - workspace-state:/workspace
    - eval-evidence:/harbor/evidence:ro
    - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: localhost,127.0.0.1,::1,world-controller,calendar,content-platform,delivery-logistics,ecommerce,email,hotel-booking,maps,notification-hub,notion,rail-booking,weather
      no_proxy: localhost,127.0.0.1,::1,world-controller,calendar,content-platform,delivery-logistics,ecommerce,email,hotel-booking,maps,notification-hub,notion,rail-booking,weather
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
    - workspace-state:/target
    restart: 'no'
  calendar:
    build:
      context: ./servers/calendar_mock
    volumes:
    - ./seeds/calendar:/env-seed:ro
    - calendar-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: &id001
      test:
      - CMD
      - python
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  content-platform:
    build:
      context: ./servers/content_platform_mock
    volumes:
    - ./seeds/content_platform:/env-seed:ro
    - content-platform-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  delivery-logistics:
    build:
      context: ./servers/delivery_logistics_mock
    volumes:
    - ./seeds/delivery_logistics:/env-seed:ro
    - delivery-logistics-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  ecommerce:
    build:
      context: ./servers/ecommerce_mock
    volumes:
    - ./seeds/ecommerce:/env-seed:ro
    - ecommerce-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  email:
    build:
      context: ./servers/email_mock
    volumes:
    - ./seeds/email:/env-seed:ro
    - email-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  hotel-booking:
    build:
      context: ./servers/hotel_booking_mock
    volumes:
    - ./seeds/hotel_booking:/env-seed:ro
    - hotel-booking-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  maps:
    build:
      context: ./servers/maps_mock
    volumes:
    - ./seeds/maps:/env-seed:ro
    - maps-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  notification-hub:
    build:
      context: ./servers/notification_hub_mock
    volumes:
    - ./seeds/notification_hub:/env-seed:ro
    - notification-hub-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  notion:
    build:
      context: ./servers/notion_mock
    volumes:
    - ./seeds/notion:/env-seed:ro
    - notion-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  rail-booking:
    build:
      context: ./servers/rail_booking_mock
    volumes:
    - ./seeds/rail_booking:/env-seed:ro
    - rail-booking-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  weather:
    build:
      context: ./servers/weather_mock
    volumes:
    - ./seeds/weather:/env-seed:ro
    - weather-env:/env
    - world-clock:/world-clock:ro
    expose:
    - '8000'
    healthcheck: *id001
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    environment:
      HEALTH_TOKEN: constructor-exam-site-project-safety-health-v1
      WORLD_CLOCK_FILE: /world-clock/current.json
      WORLD_CLOCK_REQUIRED: '1'
      CLOCK_TOKEN: constructor-exam-site-project-safety-clock-v1
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      calendar:
        condition: service_healthy
      content-platform:
        condition: service_healthy
      delivery-logistics:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
      email:
        condition: service_healthy
      hotel-booking:
        condition: service_healthy
      maps:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
      rail-booking:
        condition: service_healthy
      weather:
        condition: service_healthy
    volumes:
    - calendar-env:/calendar-env
    - content-platform-env:/content-platform-env
    - delivery-logistics-env:/delivery-logistics-env
    - ecommerce-env:/ecommerce-env
    - email-env:/email-env
    - hotel-booking-env:/hotel-booking-env
    - maps-env:/maps-env
    - notification-hub-env:/notification-hub-env
    - notion-env:/notion-env
    - rail-booking-env:/rail-booking-env
    - weather-env:/weather-env
    - controller-state:/controller-state
    - workspace-state:/workspace-source:ro
    - eval-evidence:/evidence
    - world-clock:/world-clock
    expose:
    - '8090'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',
        timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
volumes:
  workspace-state: null
  calendar-env: null
  content-platform-env: null
  delivery-logistics-env: null
  ecommerce-env: null
  email-env: null
  hotel-booking-env: null
  maps-env: null
  notification-hub-env: null
  notion-env: null
  rail-booking-env: null
  weather-env: null
  controller-state: null
  eval-evidence: null
  world-clock: null
