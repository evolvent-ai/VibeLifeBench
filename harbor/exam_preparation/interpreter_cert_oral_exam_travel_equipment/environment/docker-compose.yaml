services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      calendar:
        condition: service_healthy
      content-platform:
        condition: service_healthy
      delivery-logistics:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
      email:
        condition: service_healthy
      health-tracker:
        condition: service_healthy
      hotel-booking:
        condition: service_healthy
      maps:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
      notion:
        condition: service_healthy
      rail-booking:
        condition: service_healthy
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      WORLD_CLOCK_REQUIRED: "1"
      NO_PROXY: localhost,127.0.0.1,::1,world-controller,calendar,content-platform,delivery-logistics,ecommerce,email,health-tracker,hotel-booking,maps,notification-hub,notion,rail-booking
      no_proxy: localhost,127.0.0.1,::1,world-controller,calendar,content-platform,delivery-logistics,ecommerce,email,health-tracker,hotel-booking,maps,notification-hub,notion,rail-booking
  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
      - workspace-state:/target
    restart: "no"
  calendar: &mock
    build:
      context: ./servers/calendar_mock
    volumes:
      - ./seeds/calendar:/env-seed:ro
      - calendar-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: &health
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment: &clockenv
      WORLD_CLOCK_FILE: /world-clock/current.json
  content-platform:
    <<: *mock
    build: {context: ./servers/content_platform_mock}
    volumes: [./seeds/content_platform:/env-seed:ro, content-platform-env:/env, world-clock:/world-clock:ro]
  delivery-logistics:
    <<: *mock
    build: {context: ./servers/delivery_logistics_mock}
    volumes: [./seeds/delivery_logistics:/env-seed:ro, delivery-logistics-env:/env, world-clock:/world-clock:ro]
  ecommerce:
    <<: *mock
    build: {context: ./servers/ecommerce_mock}
    volumes: [./seeds/ecommerce:/env-seed:ro, ecommerce-env:/env, world-clock:/world-clock:ro]
  email:
    <<: *mock
    build: {context: ./servers/email_mock}
    volumes: [./seeds/email:/env-seed:ro, email-env:/env, world-clock:/world-clock:ro]
  health-tracker:
    <<: *mock
    build: {context: ./servers/health_tracker_mock}
    volumes: [./seeds/health_tracker:/env-seed:ro, health-tracker-env:/env, world-clock:/world-clock:ro]
  hotel-booking:
    <<: *mock
    build: {context: ./servers/hotel_booking_mock}
    volumes: [./seeds/hotel_booking:/env-seed:ro, hotel-booking-env:/env, world-clock:/world-clock:ro]
  maps:
    <<: *mock
    build: {context: ./servers/maps_mock}
    volumes: [./seeds/maps:/env-seed:ro, maps-env:/env, world-clock:/world-clock:ro]
  notification-hub:
    <<: *mock
    build: {context: ./servers/notification_hub_mock}
    volumes: [./seeds/notification_hub:/env-seed:ro, notification-hub-env:/env, world-clock:/world-clock:ro]
  notion:
    <<: *mock
    build: {context: ./servers/notion_mock}
    volumes: [./seeds/notion:/env-seed:ro, notion-env:/env, world-clock:/world-clock:ro]
  rail-booking:
    <<: *mock
    build: {context: ./servers/rail_booking_mock}
    volumes: [./seeds/rail_booking:/env-seed:ro, rail-booking-env:/env, world-clock:/world-clock:ro]
  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      calendar: {condition: service_healthy}
      content-platform: {condition: service_healthy}
      delivery-logistics: {condition: service_healthy}
      ecommerce: {condition: service_healthy}
      email: {condition: service_healthy}
      health-tracker: {condition: service_healthy}
      hotel-booking: {condition: service_healthy}
      maps: {condition: service_healthy}
      notification-hub: {condition: service_healthy}
      notion: {condition: service_healthy}
      rail-booking: {condition: service_healthy}
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      WORLD_CLOCK_REQUIRED: "1"
      CLOCK_TOKEN: interpreter-cert-oral-exam-travel-equipment-clock-7d3f9a
      HEALTH_TOKEN: interpreter-health-token-8f31c2a9b7
    volumes:
      - calendar-env:/calendar-env
      - content-platform-env:/content-platform-env
      - delivery-logistics-env:/delivery-logistics-env
      - ecommerce-env:/ecommerce-env
      - email-env:/email-env
      - health-tracker-env:/health-tracker-env
      - hotel-booking-env:/hotel-booking-env
      - maps-env:/maps-env
      - notification-hub-env:/notification-hub-env
      - notion-env:/notion-env
      - rail-booking-env:/rail-booking-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: ["8090"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
volumes:
  workspace-state:
  eval-evidence:
  world-clock:
  controller-state:
  calendar-env:
  content-platform-env:
  delivery-logistics-env:
  ecommerce-env:
  email-env:
  health-tracker-env:
  hotel-booking-env:
  maps-env:
  notification-hub-env:
  notion-env:
  rail-booking-env:
