services:
  main:
    build: {context: ., dockerfile: Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      world-controller: {condition: service_healthy}
      calendar: {condition: service_healthy}
      email: {condition: service_healthy}
      health-tracker: {condition: service_healthy}
      notion: {condition: service_healthy}
      weather: {condition: service_healthy}
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,::1,localhost,calendar,email,health-tracker,notion,weather,world-controller
      no_proxy: 127.0.0.1,::1,localhost,calendar,email,health-tracker,notion,weather,world-controller

  workspace-init:
    build: {context: ., dockerfile: workspace-init/Dockerfile}
    volumes: [workspace-state:/target]
    restart: "no"

  calendar: &calendar
    build: {context: ./servers/calendar_mock}
    volumes:
      - ./seeds/calendar:/env-seed:ro
      - calendar-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: &mock-health
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}

  email:
    build: {context: ./servers/email_mock}
    volumes:
      - ./seeds/email:/env-seed:ro
      - email-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}

  health-tracker:
    build: {context: ./servers/health_tracker_mock}
    volumes:
      - ./seeds/health_tracker:/env-seed:ro
      - health-tracker-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}

  notion:
    build: {context: ./servers/notion_mock}
    volumes:
      - ./seeds/notion:/env-seed:ro
      - notion-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}

  weather:
    build: {context: ./servers/weather_mock}
    volumes:
      - ./seeds/weather:/env-seed:ro
      - weather-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: *mock-health
    environment: {WORLD_CLOCK_FILE: /world-clock/current.json}

  world-controller:
    build: {context: ., dockerfile: world-controller/Dockerfile}
    depends_on:
      workspace-init: {condition: service_completed_successfully}
      calendar: {condition: service_healthy}
      email: {condition: service_healthy}
      health-tracker: {condition: service_healthy}
      notion: {condition: service_healthy}
      weather: {condition: service_healthy}
    volumes:
      - calendar-env:/calendar-env
      - email-env:/email-env
      - health-tracker-env:/health-tracker-env
      - notion-env:/notion-env
      - weather-env:/weather-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: ["8090"]
    environment:
      HEALTH_TOKEN: choir-member-low-impact-knee-privacy-049-health
      CLOCK_TOKEN: choir-member-low-impact-knee-privacy-049-clock
      RELEASE_TOKEN: choir-member-low-impact-knee-privacy-049-release
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,localhost,calendar,email,health-tracker,notion,weather,world-controller
      no_proxy: 127.0.0.1,localhost,calendar,email,health-tracker,notion,weather,world-controller
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

volumes:
  workspace-state:
  calendar-env:
  email-env:
  health-tracker-env:
  notion-env:
  weather-env:
  controller-state:
  eval-evidence:
  world-clock:
