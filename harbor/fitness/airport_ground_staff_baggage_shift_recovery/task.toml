schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "fitness/airport-ground-staff-baggage-shift-recovery"
description = "A self-contained 22-step, 28-stage workflow for maintaining a safety-first 35-day training and recovery plan for an airport baggage-handling worker across rotating shifts, health changes, apron weather, authorization boundaries, incomplete data, and a conservative final review."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "fitness", "airport-ground-staff", "baggage-handling", "shift-work", "sleep-recovery", "health-safety", "weather", "authorization", "long-horizon"]

[metadata]
difficulty = "hard"
category = "fitness"
tags = ["shift-work", "airport-ground-staff", "baggage-handling", "health-safety", "calendar", "weather", "email-boundary", "sleep-recovery", "long-horizon", "cross-stage-consistency"]
source_task = "airport_ground_staff_baggage_shift_recovery"
source_event_count = 32
virtual_stage_count = 28
harbor_step_count = 22
mutation_event_count = 10
release_count = 10
stage_boundary_count = 21
server_count = 5
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Transportation and Fitness"
occupation = "Airport Ground Operations and Baggage Handling"
onet_skills = ["Monitoring", "Critical Thinking", "Time Management", "Judgment and Decision Making", "Active Listening"]

[metadata.estimates]
task_completion_hours = 10.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 19
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "notion-records", "calendar-events"]
deliverables = ["stage progress", "service consistency matrix", "risk log", "calendar change log", "authorization log", "venue and weather log", "data quality log", "final review"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
