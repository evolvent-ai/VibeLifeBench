schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/broadcast-exam-posture-breathing-32d"
description = "A 28-step Harbor task for safe posture, breathing, voice-load management, and a pre-exam taper."
authors = [{ name = "VibeLifeBench" }]
keywords = ["multi-step", "fitness", "posture", "breathing", "voice", "health-safety", "calendar", "weather"]

[metadata]
difficulty = "hard"
category = "fitness"
tags = ["long-horizon", "posture", "breathing", "health-safety", "calendar", "weather", "authorization", "voice-fatigue"]
source_task = "broadcast_exam_posture_breathing_32d"
virtual_stage_count = 26
harbor_step_count = 28
source_event_count = 40
visible_event_count = 28
mutation_event_count = 12
release_count = 10
stage_boundary_count = 21
server_count = 5
source_scoring = "flat-pool"

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
