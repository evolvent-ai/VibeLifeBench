services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      world-controller:
        condition: service_healthy
      calendar:
        condition: service_healthy
      email:
        condition: service_healthy
      health-tracker:
        condition: service_healthy
      notion:
        condition: service_healthy
      review-platform:
        condition: service_healthy
      weather:
        condition: service_healthy
    volumes:
      - workspace-state:/workspace
      - eval-evidence:/harbor/evidence:ro
      - world-clock:/world-clock:ro
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
      NO_PROXY: 127.0.0.1,::1,calendar,email,health-tracker,health_tracker,localhost,notion,review-platform,review_platform,weather,workspace-init,workspace_init,world-controller,world_controller
      no_proxy: 127.0.0.1,::1,calendar,email,health-tracker,health_tracker,localhost,notion,review-platform,review_platform,weather,workspace-init,workspace_init,world-controller,world_controller

  workspace-init:
    build:
      context: .
      dockerfile: workspace-init/Dockerfile
    volumes:
      - workspace-state:/target
    restart: "no"

  calendar:
    build:
      context: ./servers/calendar_mock
    volumes:
      - ./seeds/calendar:/env-seed:ro
      - calendar-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: &mock-health
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json

  email:
    build:
      context: ./servers/email_mock
    volumes:
      - ./seeds/email:/env-seed:ro
      - email-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: *mock-health
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json

  health-tracker:
    build:
      context: ./servers/health_tracker_mock
    volumes:
      - ./seeds/health_tracker:/env-seed:ro
      - health-tracker-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: *mock-health
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json

  notion:
    build:
      context: ./servers/notion_mock
    volumes:
      - ./seeds/notion:/env-seed:ro
      - notion-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: *mock-health
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json

  review-platform:
    build:
      context: ./servers/review_platform_mock
    volumes:
      - ./seeds/review_platform:/env-seed:ro
      - review-platform-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: *mock-health
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json

  weather:
    build:
      context: ./servers/weather_mock
    volumes:
      - ./seeds/weather:/env-seed:ro
      - weather-env:/env
      - world-clock:/world-clock:ro
    expose: ["8000"]
    healthcheck: *mock-health
    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json

  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    environment:
      HEALTH_TOKEN: dragon-boat-037-health-20260824
      CLOCK_TOKEN: dragon-boat-037-clock-20260824
      SCENARIO_CLOCK_PATH: /world-clock/current.json
      SCENARIO_CLOCK_REQUIRED: "1"
      WORLD_CLOCK_FILE: /world-clock/current.json
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      calendar:
        condition: service_healthy
      email:
        condition: service_healthy
      health-tracker:
        condition: service_healthy
      notion:
        condition: service_healthy
      review-platform:
        condition: service_healthy
      weather:
        condition: service_healthy
    volumes:
      - calendar-env:/calendar-env
      - email-env:/email-env
      - health-tracker-env:/health-tracker-env
      - notion-env:/notion-env
      - review-platform-env:/review-platform-env
      - weather-env:/weather-env
      - controller-state:/controller-state
      - workspace-state:/workspace-source:ro
      - eval-evidence:/evidence
      - world-clock:/world-clock
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

volumes:
  workspace-state:
  calendar-env:
  email-env:
  health-tracker-env:
  notion-env:
  review-platform-env:
  weather-env:
  controller-state:
  eval-evidence:
  world-clock:
