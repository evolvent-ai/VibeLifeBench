SOURCE_EVENT_ID = "s23_hr_camp_notice"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-018 23 s23_hr_camp_notice 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
# Freezing a stage hashes and copies the whole accumulated evidence tree; under
# a loaded docker host this can exceed harbor's 60s hook default (measured:
# event-012 and event-000 snapshot hooks timed out at 60s and the arm died as
# VerifierInfrastructureError with no frozen stage manifest). The main
# evidence-collector hook already runs with 300s, so give the snapshot hook the
# same budget instead of letting a busy host abort an otherwise healthy trial.
timeout_sec = 300.0
command = "/opt/world-controller/snapshot event-018"

[[steps]]
name = "event-019"
min_reward = { verifier_ok = 1.0 }
artifacts = [{ source = "/evidence/steps/event-019", destination = "evidence", service = "world-controller" }, { source = "/evidence/stages/stage-24", destination = "evidence-stage-24", service = "world-controller" }]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-019"
