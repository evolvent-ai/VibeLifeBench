schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/cross-city-remote-viewing-rental"
description = "A self-contained 24-step Harbor task for a cross-city rental search, remote verification, and controlled move-in planning."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "rental", "remote-viewing", "commute", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "housing-and-relocation"
tags = ["long-horizon", "multi-step", "rental", "privacy", "authorization", "deadline-management"]
source_task = "cross_city_remote_viewing_rental"
virtual_stage_count = 24
harbor_step_count = 24
source_event_count = 38
mutation_event_count = 14
release_count = 14
stage_boundary_count = 24
server_count = 8
source_scoring = "flat-pool"

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
name = "calendar"
transport = "streamable-http"
url = "http://calendar:8000/mcp"

[[environment.mcp_servers]]
name = "email"
transport = "streamable-http"
url = "http://email:8000/mcp"

[[environment.mcp_servers]]
name = "legal_search"
transport = "streamable-http"
url = "http://legal-search:8000/mcp"

[[environment.mcp_servers]]
name = "listing_platform"
transport = "streamable-http"
url = "http://listing-platform:8000/mcp"

[[environment.mcp_servers]]
name = "maps"
transport = "streamable-http"
url = "http://maps:8000/mcp"

[[environment.mcp_servers]]
name = "notification_hub"
transport = "streamable-http"
url = "http://notification-hub:8000/mcp"

[[environment.mcp_servers]]
name = "notion"
transport = "streamable-http"
url = "http://notion:8000/mcp"

[[environment.mcp_servers]]
name = "review_platform"
transport = "streamable-http"
url = "http://review-platform:8000/mcp"

[[steps]]
name = "event-000"
min_reward = { verifier_ok = 1.0 }
