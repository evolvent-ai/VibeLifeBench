[steps.verifier.env]
HARBOR_STEP_NAME = "event-000"
VIRTUAL_STAGE = "0"
SOURCE_EVENT_ID = "ev0_user"
STAGE_BOUNDARY = "1"
RUN_STAGE_RUBRIC = "1"

[[steps.verifier.collect]]
