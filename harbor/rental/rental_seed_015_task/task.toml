schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "local/rental-seed-015-task"
description = "A 43-step, 26-stage residential rental search and family logistics task for a single parent in Nanjing."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "rental", "family-logistics", "school-commute", "privacy", "authorization", "risk-management"]

[metadata]
difficulty = "hard"
category = "rental"
tags = ["long-horizon", "single-parent", "listing-search", "route-verification", "school-calendar", "privacy", "state-recovery"]
source_task = "rental_seed_015_task"
source_event_count = 50
virtual_stage_count = 26
harbor_step_count = 43
mutation_event_count = 7
release_count = 7
stage_boundary_count = 26
server_count = 7
source_scoring = "flat-pool"
source_check_count = 52
source_total_weight = 80.25
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Real Estate and Relocation Services"
occupation = "Residential Rental Search and Family Logistics Coordinator"
onet_skills = ["Information Ordering", "Critical Thinking", "Monitoring", "Judgment and Decision Making", "Time Management"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 10
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["notion-records", "calendar-events", "email-messages", "internal-files"]
deliverables = ["rental candidate tracker", "route matrix", "budget ledger", "risk register", "authorization log", "privacy materials register", "care coverage plan", "final rental archive"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
name = "calendar"
transport = "streamable-http"
url = "http://calendar:8000/mcp"

[[environment.mcp_servers]]
name = "email"
transport = "streamable-http"
url = "http://email:8000/mcp"

[[environment.mcp_servers]]
name = "listing_platform"
transport = "streamable-http"
url = "http://listing-platform:8000/mcp"

[[environment.mcp_servers]]
