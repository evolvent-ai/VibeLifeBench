schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "local/rental-seed-018"
description = "A 25-step Harbor task for helping an international employee find a legitimate one-bedroom rental in Beijing while managing commute, budget, contracting-entity, privacy, authorization, phishing, viewing, and documentation risks."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "rental", "Beijing", "listing-search", "commute", "contracting-entity", "privacy", "authorization", "phishing", "long-horizon"]

[metadata]
difficulty = "hard"
category = "rental"
tags = ["long-horizon", "multi-step", "listing-search", "commute-validation", "contracting-entity", "privacy", "authorization", "phishing-recovery", "foreign-employee"]
source_task = "rental_seed_018_task"
source_event_count = 31
mutation_event_count = 6
virtual_stage_count = 25
harbor_step_count = 25
release_count = 6
stage_boundary_count = 25
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "Housing and Rental Operations"
occupation = "Rental Search Coordinator"
onet_skills = ["Active Listening", "Information Gathering", "Monitoring", "Critical Thinking", "Coordination", "Judgment and Decision Making", "Time Management"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 74
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "csv", "notion-records", "calendar-events", "email", "notifications"]
deliverables = ["candidate tracker", "budget ledger", "risk register", "contact trust log", "viewing calendar", "minimum-disclosure matrix", "bilingual communication drafts", "final decision package"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 14400.0
cpus = 8
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/workspace"

[[environment.mcp_servers]]
name = "calendar"
transport = "streamable-http"
url = "http://calendar:8000/mcp"

[[environment.mcp_servers]]
