min_reward = { verifier_ok = 1.0 }
artifacts = [
  { source = "/evidence/steps/event-026", destination = "evidence", service = "world-controller" },
  { source = "/evidence/stages/stage-21", destination = "evidence-stage-21", service = "world-controller" },
]

[steps.verifier.env]
HARBOR_STEP_NAME = "event-026"
VIRTUAL_STAGE = "21"
RUN_STAGE_RUBRIC = "1"
STAGE_BOUNDARY = "1"
SOURCE_EVENT_ID = "S21_price_window_notice"

[[steps.verifier.collect]]
service = "main"
command = "/opt/evidence-collector/collect event-026 21 S21_price_window_notice 1"
timeout_sec = 300.0
user = "root"

[[steps.verifier.collect]]
service = "world-controller"
command = "/opt/world-controller/snapshot event-026"

