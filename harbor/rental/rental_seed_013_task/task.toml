schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "rental/rental-seed-013-task"
description = "A 32-step cross-city rental task covering short-term transition housing, long-term rental selection, workplace changes, commute validation, logistics, proof of address, lease risk, privacy, authorization, and final archiving."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "rental", "relocation", "short-term-rental", "commute", "logistics", "lease-risk", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "rental"
tags = ["long-horizon", "multi-step", "short-term-transition", "long-term-rental", "workplace-relocation", "commute-validation", "logistics", "proof-of-address", "lease-risk", "privacy", "authorization", "final-archive"]
source_task = "rental_seed_013_task"
source_event_count = 48
virtual_stage_count = 26
harbor_step_count = 32
release_count = 15
stage_boundary_count = 26
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "rental housing operations"
occupation = "relocation and rental coordination"
onet_skills = ["monitoring", "information ordering", "judgment and decision making", "time management", "risk assessment"]

[metadata.estimates]
task_completion_hours = 16.0
task_creation_hours = 48.0

[metadata.resources]
input_file_count = 11
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email-drafts", "logistics-orders"]
deliverables = ["short-term candidate tracker", "long-term candidate tracker", "budget ledger", "commute validation", "logistics address-switch plan", "proof-of-address plan", "risk and authorization register", "final decision package"]

[agent]
timeout_sec = 14400.0
user = "root"

[solution.env]
VERIFY_STEP = "0"

[verifier]
