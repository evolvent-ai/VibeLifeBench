    environment:
      WORLD_CLOCK_FILE: /world-clock/current.json
  world-controller:
    build:
      context: .
      dockerfile: world-controller/Dockerfile
    environment:
      HEALTH_TOKEN: old-home-renovation-health-2f9fee4f
      WORLD_CLOCK_FILE: /world-clock/current.json
      CLOCK_TOKEN: old-home-renovation-clock-5f8d48f1
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      banking:
        condition: service_healthy
      calendar:
        condition: service_healthy
      delivery-logistics:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
      email:
        condition: service_healthy
      legal-search:
        condition: service_healthy
      listing-platform:
        condition: service_healthy
      notification-hub:
        condition: service_healthy
    volumes:
    - controller-state:/controller-state
    - workspace-state:/workspace-source:ro
    - eval-evidence:/evidence
    - banking-env:/banking-env
    - calendar-env:/calendar-env
    - delivery-logistics-env:/delivery-logistics-env
    - ecommerce-env:/ecommerce-env
    - email-env:/email-env
    - legal-search-env:/legal-search-env
    - listing-platform-env:/listing-platform-env
    - notification-hub-env:/notification-hub-env
    - world-clock:/world-clock
    expose:
    - '8090'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',
        timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
volumes:
  workspace-state: null
  controller-state: null
  eval-evidence: null
  world-clock: null
  banking-env: null
  calendar-env: null
  delivery-logistics-env: null
  ecommerce-env: null
  email-env: null
  legal-search-env: null
  listing-platform-env: null
  notification-hub-env: null
