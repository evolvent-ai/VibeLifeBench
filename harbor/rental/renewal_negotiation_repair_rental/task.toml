schema_version = "1.3"

multi_step_reward_strategy = "final"

[task]
name = "rental/renewal-negotiation-repair-rental"
description = "A 24-step Harbor task for renewal negotiation, rental repair responsibility, commute validation, market comparison, privacy, authorization, and final archiving."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "rental", "renewal", "repair-risk", "commute", "market-comparison", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "rental"
tags = ["long-horizon", "multi-step", "rental-renewal", "repair-responsibility", "commute-validation", "privacy", "authorization", "final-archive"]
source_task = "renewal_negotiation_repair_rental"
source_event_count = 34
virtual_stage_count = 24
harbor_step_count = 24
release_count = 10
stage_boundary_count = 24
server_count = 8
source_scoring = "flat-pool"
language = "en"
timezone = "Asia/Shanghai"
web_search = "disabled"

[metadata.taxonomy]
sector = "rental housing operations"
occupation = "rental decision coordination"
onet_skills = ["monitoring", "information ordering", "judgment and decision making", "time management", "risk assessment"]

[metadata.estimates]
task_completion_hours = 12.0
task_creation_hours = 40.0

[metadata.resources]
input_file_count = 5
multimodal = false
web_search_allowed = false

[metadata.output]
deliverable_count = 8
deliverable_formats = ["markdown", "notion-records", "calendar-events", "email-drafts"]
deliverables = ["candidate tracker", "commute validation", "viewing plan", "cost ledger", "risk register", "authorization log", "repair responsibility checklist", "final archive"]

