schema_version = "1.3"
multi_step_reward_strategy = "final"

[task]
name = "local/family-kindergarten-low-voc"
description = "A 28-step Harbor task for a family rental search and child-safe move-in planning in Hangzhou."
authors = [{ name = "synthetic_benchmark_author" }]
keywords = ["multi-step", "rental-search", "child-safety", "privacy", "authorization"]

[metadata]
difficulty = "hard"
category = "family logistics"
tags = ["long-horizon", "multi-step", "rental", "child-safety", "privacy", "authorization"]
