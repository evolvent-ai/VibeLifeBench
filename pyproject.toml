[project]
name = "vibelifebench"
version = "1.1.0"
description = "VibeLifeBench: long-horizon life-admin agent tasks with mock services and the Terrarium capability layer."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7",
    "pyyaml>=6.0",
    "mcp>=1.11",
    "terrarium",
    "socksio>=1.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# Pinned to the exact commit this benchmark was validated against. Do NOT drop the
# rev: upstream main has moved past this commit, and later Terrarium builds can
# change the session/runner behavior. uv.lock records the same commit.
terrarium = { git = "https://github.com/evolvent-ai/Terrarium", rev = "7d641ea587687e7360f2bf74951b9353c2894b18" }
