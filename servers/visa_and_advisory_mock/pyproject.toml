[project]
name = "visa-and-advisory-mock"
version = "0.1.0"
description = "FastMCP-based mock visa-entry / eVisa / travel-advisory server (SQLite, streamable-HTTP, offline)"
readme = "README.md"
authors = [
    { name = "benchmark author" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "pydantic>=2.7",
    "typing-extensions>=4.9.0",
]

[project.scripts]
visa-and-advisory-mock = "visa_and_advisory_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visa_and_advisory_mock"]

[tool.hatch.build]
include = [
    "src/visa_and_advisory_mock/**/*.py",
]
