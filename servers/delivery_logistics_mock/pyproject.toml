[project]
name = "delivery-logistics-mock"
version = "0.1.0"
description = "FastMCP-based mock express shipping / delivery server (SF / JD / ZTO style, SQLite, offline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
delivery-logistics-mock = "delivery_logistics_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_logistics_mock"]

[tool.hatch.build]
include = [
    "src/delivery_logistics_mock/**/*.py",
]
