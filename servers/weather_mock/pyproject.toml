[project]
name = "weather-mock"
version = "0.1.0"
description = "FastMCP-based mock weather server (SQLite, streamable-HTTP, offline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "tzdata>=2024.1",
]

[project.scripts]
weather-mock = "weather_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_mock"]

[tool.hatch.build]
include = [
    "src/weather_mock/**/*.py",
]
