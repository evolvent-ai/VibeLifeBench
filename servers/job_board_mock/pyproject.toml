[project]
name = "job-board-mock"
version = "0.1.0"
description = "FastMCP-based mock job-board server (SQLite, streamable-HTTP, offline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
job-board-mock = "job_board_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_board_mock"]

[tool.hatch.build]
include = [
    "src/job_board_mock/**/*.py",
]
