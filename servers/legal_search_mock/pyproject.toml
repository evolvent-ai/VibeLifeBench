[project]
name = "legal-search-mock"
version = "0.1.0"
description = "FastMCP-based mock Chinese legal-research server (cases + statutes + citations; SQLite, streamable-HTTP, offline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
legal-search-mock = "legal_search_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_search_mock"]

[tool.hatch.build]
include = [
    "src/legal_search_mock/**/*.py",
]
