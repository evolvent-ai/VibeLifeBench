[project]
name = "ecommerce-mock"
version = "0.1.0"
description = "A FastMCP-based mock e-commerce (taobao/JD style) server (SQLite, offline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
ecommerce-mock = "ecommerce_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_mock"]

[tool.hatch.build]
include = [
    "src/ecommerce_mock/**/*.py",
]
