[project]
name = "banking-mock"
version = "0.1.0"
description = "FastMCP-based mock retail banking server (SQLite, streamable-HTTP, offline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
banking-mock = "banking_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_mock"]

[tool.hatch.build]
include = [
    "src/banking_mock/**/*.py",
]
