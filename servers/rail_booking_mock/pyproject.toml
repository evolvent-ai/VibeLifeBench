[project]
name = "rail-booking-mock"
version = "0.1.0"
description = "FastMCP-based mock China rail booking server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
]

[project.scripts]
rail-booking-mock = "rail_booking_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rail_booking_mock"]

[tool.hatch.build]
include = [
    "src/rail_booking_mock/**/*.py",
]
