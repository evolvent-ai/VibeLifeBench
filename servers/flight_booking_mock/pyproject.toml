[project]
name = "flight-booking-mock"
version = "0.1.0"
description = "FastMCP-based mock flight booking server (Amadeus-flavored, streamable-HTTP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0,<2.0.0",
    "pydantic>=2.7",
    "typing-extensions>=4.9.0",
]

[project.scripts]
flight-booking-mock = "flight_booking_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_booking_mock"]

[tool.hatch.build]
include = [
    "src/flight_booking_mock/**/*.py",
]
