[project]
name = "credit-card-mock"
version = "0.1.0"
description = "FastMCP-based mock credit-card simulator (SQLite, offline, HTTP-only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
credit-card-mock = "credit_card_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_card_mock"]

[tool.hatch.build]
include = [
    "src/credit_card_mock/**/*.py",
]
