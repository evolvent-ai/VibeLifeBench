[project]
name = "health-tracker-mock"
version = "0.1.0"
description = "FastMCP-based mock personal health tracker server (SQLite, streamable-HTTP, offline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
health-tracker-mock = "health_tracker_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_tracker_mock"]

[tool.hatch.build]
include = [
    "src/health_tracker_mock/**/*.py",
]
