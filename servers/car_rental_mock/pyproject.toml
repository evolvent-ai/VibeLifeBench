[project]
name = "car-rental-mock"
version = "0.1.0"
description = "FastMCP-based mock car rental server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
]

[project.scripts]
car-rental-mock = "car_rental_mock.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_rental_mock"]

[tool.hatch.build]
include = [
    "src/car_rental_mock/**/*.py",
]

