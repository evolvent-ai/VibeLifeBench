[project]
name = "emails-mcp"
version = "0.2.0"
description = "FastMCP-based mock email server (SQLite, streamable-HTTP, offline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "mcp[cli]>=1.11.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
email-mock = "emails_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emails_mcp"]

[tool.hatch.build]
include = [
    "src/emails_mcp/**/*.py",
]
